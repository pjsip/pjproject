# PJLIB on the POSIX layer
CONFIG_POSIX_API=y
CONFIG_PJPROJECT=y

# The tests talk to themselves over loopback, UDP and TCP
CONFIG_NETWORKING=y
CONFIG_NET_DRIVERS=y
CONFIG_NET_LOOPBACK=y
CONFIG_NET_LOOPBACK_MTU=65535
# Resolves "localhost" without a server
CONFIG_DNS_RESOLVER=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_MAX_CONTEXTS=48
CONFIG_NET_MAX_CONN=48
CONFIG_ZVFS_OPEN_MAX=48
# select() is built on poll() and fails with ENOMEM beyond this many fds
CONFIG_ZVFS_POLL_MAX=48
# poll() keeps a k_poll_event per fd on the stack, which overflows the
# default stack of the socket service thread (DNS resolver)
CONFIG_NET_SOCKETS_SERVICE_STACK_SIZE=3072
CONFIG_NET_PKT_RX_COUNT=32
CONFIG_NET_PKT_TX_COUNT=32
CONFIG_NET_BUF_RX_COUNT=128
CONFIG_NET_BUF_TX_COUNT=128
CONFIG_NET_TCP_MAX_SEND_WINDOW_SIZE=16384
CONFIG_NET_TCP_MAX_RECV_WINDOW_SIZE=16384

# Memory: PJLIB pools come from the C library heap, sized in Kconfig. The
# tests run in the main thread.
CONFIG_MAIN_STACK_SIZE=32768
CONFIG_ISR_STACK_SIZE=2048

# The board's hardware random number generator; the pjproject-target snippet
# gives the emulated boards a stand-in
CONFIG_ENTROPY_GENERATOR=y

# Console
CONFIG_PRINTK=y
CONFIG_LOG=n
