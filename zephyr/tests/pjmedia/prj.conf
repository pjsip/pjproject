# PJLIB on the POSIX layer
CONFIG_POSIX_API=y
CONFIG_PJPROJECT=y

# pjlib's socket layer is Zephyr's socket API. The media tests themselves
# use the loopback media transport and open no socket.
CONFIG_NETWORKING=y
CONFIG_NET_DRIVERS=y
CONFIG_NET_LOOPBACK=y
CONFIG_DNS_RESOLVER=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_TCP=n
CONFIG_NET_SOCKETS=y
CONFIG_ZVFS_OPEN_MAX=32

# Memory: PJLIB pools come from the C library heap, sized in Kconfig. The
# tests run in the main thread; mips_test keeps its table of entries on the
# stack, 11 KB.
CONFIG_MAIN_STACK_SIZE=32768
CONFIG_ISR_STACK_SIZE=2048

# The board's hardware random number generator; the pjproject-target snippet
# gives the emulated boards a stand-in
CONFIG_ENTROPY_GENERATOR=y

# Speed over size, for the benchmark: Zephyr's default is -Os. The sample
# keeps the default, which its footprint figures are for.
CONFIG_SPEED_OPTIMIZATIONS=y

# Console. The benchmark prints its figures with %f.
CONFIG_PRINTK=y
CONFIG_LOG=n
CONFIG_REQUIRES_FLOAT_PRINTF=y
