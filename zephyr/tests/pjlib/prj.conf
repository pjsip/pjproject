# PJLIB on the POSIX layer
CONFIG_POSIX_API=y
CONFIG_PJPROJECT=y
CONFIG_PJPROJECT_LOG_MAX_LEVEL=5
CONFIG_PJPROJECT_IOQUEUE_MAX_HANDLES=64

# The socket and ioqueue tests talk to themselves over loopback, with
# many sockets open at once
CONFIG_NETWORKING=y
CONFIG_NET_DRIVERS=y
CONFIG_NET_LOOPBACK=y
# The socket tests send datagrams of up to 8 KB, so loopback gets a large
# MTU and enough buffers for such a packet in each direction
CONFIG_NET_LOOPBACK_MTU=65535
# Resolves "localhost" without a server
CONFIG_DNS_RESOLVER=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
# One test opens 61 sockets while the previous test's TCP sockets are still
# in TIME_WAIT, each holding a context
CONFIG_NET_MAX_CONTEXTS=80
CONFIG_NET_MAX_CONN=80
CONFIG_ZVFS_OPEN_MAX=88
# select() is built on poll() and fails with ENOMEM beyond this many fds
CONFIG_ZVFS_POLL_MAX=88
# poll() keeps a k_poll_event per fd on the stack, 16 B each, which overflows
# the 1200 B default of the socket service thread (DNS resolver)
CONFIG_NET_SOCKETS_SERVICE_STACK_SIZE=3072
# The loopback driver waits up to 100 ms for a free RX packet on every send
# when the pool is empty. The ioqueue stress test keeps many packets in
# flight, so give it a bigger pool, and send from Zephyr's TX thread so that
# the wait does not happen in the sending thread, which holds a lock the
# receivers need to free packets.
CONFIG_NET_PKT_RX_COUNT=48
CONFIG_NET_PKT_TX_COUNT=32
CONFIG_NET_TC_TX_COUNT=1
CONFIG_NET_BUF_RX_COUNT=160
CONFIG_NET_BUF_TX_COUNT=160
# A blocking TCP send() returns short when the window is full; make the
# window hold the test's 8 KB
CONFIG_NET_TCP_MAX_SEND_WINDOW_SIZE=16384
CONFIG_NET_TCP_MAX_RECV_WINDOW_SIZE=16384

# Memory: PJLIB pools come from the C library heap. The tests run in the
# main thread, and the activesock test keeps 100 operation keys on its
# stack, 13 KB.
CONFIG_MAIN_STACK_SIZE=32768
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=253952
# The interrupt stack never gets past a few hundred bytes here
CONFIG_ISR_STACK_SIZE=2048

# Random numbers for the emulator only; a real board uses its RNG
CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y

# Console
CONFIG_PRINTK=y
CONFIG_LOG=n
