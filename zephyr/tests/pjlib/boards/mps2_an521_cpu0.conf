# No entropy device in the QEMU model: let the test generator at least
# start from the timer, so each run differs.
CONFIG_TIMER_RANDOM_GENERATOR=y

# Kernel heap, where the threaded build takes its pthread stacks from:
# room for the 16 worker threads of the ioqueue stress test plus a few
CONFIG_HEAP_MEM_POOL_SIZE=163840

# A stack overflow then faults instead of corrupting memory silently
CONFIG_HW_STACK_PROTECTION=y
