# Threaded build: build with -DEXTRA_CONF_FILE=overlay-threads.conf. The
# settings are those of samples/embedded_ua/overlay-threads.conf with
# smaller stacks, as the tests run up to 16 threads from the kernel heap,
# plus time slicing, which the thread test expects between equal-priority
# threads.
CONFIG_PJPROJECT_THREADS=y

# Compiler thread-local storage comes off the top of every thread's stack,
# kernel threads included: pjlib's per-thread data is about 270 bytes,
# more than the idle thread's default stack of 256. The idle thread uses
# about 330 bytes of this.
CONFIG_IDLE_STACK_SIZE=1024

CONFIG_THREAD_STACK_INFO=y
CONFIG_DYNAMIC_THREAD=y
CONFIG_DYNAMIC_THREAD_ALLOC=y
CONFIG_DYNAMIC_THREAD_STACK_SIZE=8192
# The kernel heap the stacks come from is sized per board in boards/

# The ioqueue has a mutex per handle, PJ_IOQUEUE_MAX_HANDLES (config_site.h)
# of them
CONFIG_MAX_PTHREAD_MUTEX_COUNT=256
CONFIG_MAX_PTHREAD_COND_COUNT=32
# The ioqueue tests run 16 threads at a time, and a joined thread is only
# recycled a little later
CONFIG_POSIX_THREAD_THREADS_MAX=32

CONFIG_TIMESLICING=y
CONFIG_TIMESLICE_SIZE=10
