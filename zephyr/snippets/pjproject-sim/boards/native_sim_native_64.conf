# native_sim's test entropy source starts from a fixed seed, so every run
# would repeat the same Call-IDs and CSeqs, which a registrar rejects as
# a replay. Seed it from the host, as the -seed-random argument would.
CONFIG_NATIVE_EXTRA_CMDLINE_ARGS="-seed-random"

# Match the TAP's MTU of 1400 that QEMU's LAN9118 model needs, so one host
# setup serves both emulated boards
CONFIG_NET_IPV4_MTU=1400
