# QEMU's AN521 model clocks SysTick at 20 MHz where the board files say
# 25 MHz; without this the guest's clock runs at 80% of real time
CONFIG_SYS_CLOCK_HW_CYCLES_PER_SEC=20000000

# The host side of the TAP must be at MTU 1400 for QEMU's LAN9118 model
# (README_Zephyr.md, Known limitations); send nothing larger than that
CONFIG_NET_IPV4_MTU=1400

# No hardware random number generator here: a software one, seeded from
# the entropy driver, serves CONFIG_ENTROPY_GENERATOR
CONFIG_TEST_RANDOM_GENERATOR=y

# Zephyr 4.4 gives a QEMU target SLIP over a UART pipe the board does not
# have, and the build fails on it; 4.5 does not. The samples select the
# board's Ethernet in their own boards/ files, the tests use loopback only
CONFIG_NET_SLIP_TAP=n
