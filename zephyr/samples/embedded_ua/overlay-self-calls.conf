# Calls to ourselves, with no peer and no network beyond loopback: the
# footprint check CI runs (ci-zephyr.yml), together with
# -DEXTRA_CFLAGS=-DEMBUA_SELF_CALLS=2. QEMU is started with -nic none; the
# board's Ethernet stays in the build, unconnected, as in the test apps.
CONFIG_NET_LOOPBACK=y
# No DHCP, and the emulators' address for a board that has none without it
CONFIG_NET_DHCPV4=n
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.0.2.1"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_EMBUA_USE_REGISTRATION=0
CONFIG_SYS_HEAP_RUNTIME_STATS=y
