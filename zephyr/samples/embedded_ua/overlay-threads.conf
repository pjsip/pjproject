# Threaded build: build with -DEXTRA_CONF_FILE=overlay-threads.conf. pjsip runs
# in the main thread and the media clock and RTP in a pthread.
CONFIG_PJPROJECT_THREADS=y

# Compiler thread-local storage comes off the top of every thread's stack,
# kernel threads included: pjlib's per-thread data is about 270 bytes,
# more than the idle thread's default stack of 256. The idle thread uses
# about 330 bytes of this.
CONFIG_IDLE_STACK_SIZE=1024

# pthread stacks are allocated from the kernel heap. A thread created
# without a stack size, as pjlib does with stack_size 0, gets
# DYNAMIC_THREAD_STACK_SIZE, whose default of 1 KB is far too small for the
# media thread (SRTP alone overflows it).
CONFIG_THREAD_STACK_INFO=y
CONFIG_DYNAMIC_THREAD=y
CONFIG_DYNAMIC_THREAD_ALLOC=y
CONFIG_DYNAMIC_THREAD_STACK_SIZE=16384
CONFIG_HEAP_MEM_POOL_SIZE=65536

# Zephyr's defaults are 5 each; pjsip and pjmedia create more, and SIP over
# TLS (overlay-tls.conf) more still. pthread_mutex_init() fails with ENOMEM
# when the pool is used up.
CONFIG_MAX_PTHREAD_MUTEX_COUNT=128
CONFIG_MAX_PTHREAD_COND_COUNT=8
