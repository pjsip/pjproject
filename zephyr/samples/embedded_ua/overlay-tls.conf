# SIP over TLS: build with -DEXTRA_CONF_FILE=overlay-tls.conf. For the
# threaded build give both overlays: -DEXTRA_CONF_FILE="overlay-threads.conf;overlay-tls.conf".
CONFIG_PJPROJECT_TLS=y
CONFIG_NET_TCP=y

# Zephyr's Mbed TLS, driven by pjlib directly over a TCP socket (not through
# Zephyr's TLS socket option). One TLS 1.2 ciphersuite: ephemeral ECDH over
# P-256 with an RSA server certificate and AES-128-GCM, which every SIP
# server offers.
CONFIG_PSA_CRYPTO=y
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256=y
CONFIG_MBEDTLS_SSL_SERVER_NAME_INDICATION=y
# Certificates and keys given to pjsip are PEM
CONFIG_MBEDTLS_PEM_PARSE_C=y
# Incoming records can be the TLS maximum; the client picks its own record
# size, and a SIP message fits in 4 KB
CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=16384
CONFIG_MBEDTLS_SSL_OUT_CONTENT_LEN=4096
# With threads, PSA Crypto is called from two threads and needs Mbed TLS's
# threading layer, which Zephyr has no Kconfig for: this header turns it on
CONFIG_TF_PSA_CRYPTO_USER_CONFIG_FILE="psa_user_config.h"

# Mbed TLS allocates its contexts from the C library heap too: about 25 KB
# per TLS connection, most of it the record buffers above
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=327680
