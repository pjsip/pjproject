# No entropy device in the QEMU model: let the test generator at least
# start from the timer, so Call-IDs and sequence numbers differ per boot.
CONFIG_TIMER_RANDOM_GENERATOR=y

# QEMU's AN521 model clocks SysTick at 20 MHz where the board files say
# 25 MHz; without this the guest's clock runs at 80% of real time
CONFIG_SYS_CLOCK_HW_CYCLES_PER_SEC=20000000
