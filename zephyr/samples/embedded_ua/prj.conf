# PJSIP, on the POSIX layer
CONFIG_POSIX_API=y
CONFIG_PJPROJECT=y

# Networking: IPv4 over Ethernet, UDP for SIP and RTP
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_TCP=n
CONFIG_NET_SOCKETS=y
CONFIG_NET_MAX_CONTEXTS=12
CONFIG_NET_MAX_CONN=12
CONFIG_ZVFS_OPEN_MAX=24
# select() is built on poll() and fails with ENOMEM beyond this many fds
CONFIG_ZVFS_POLL_MAX=16
# Packet buffers are 128 bytes each; a SIP INVITE with SDP takes about 15
# of them. Receive is sized for four INVITEs arriving at once: each waits
# there, whole, while the call before it is set up, and the RTP of the
# calls already up keeps coming in (README_Zephyr.md, Known limitations,
# on why the pool must never run dry under QEMU). The transmit pool, which
# only holds what is in flight, is sized in the sample's Kconfig: a sent
# packet is freed as soon as the driver has it, but TCP keeps every segment
# until the peer acknowledges it, so SIP over TLS needs more.
CONFIG_NET_PKT_RX_COUNT=96
CONFIG_NET_BUF_RX_COUNT=384
# Send whole Ethernet frames rather than Zephyr's default 576-byte IPv4
# datagrams, so an outgoing INVITE is two fragments instead of four
CONFIG_NET_IPV4_MTU=1500
# A SIP INVITE with SDP often exceeds the Ethernet MTU, so IPv4 fragments
# must be reassembled, and the buffers must hold a reassembled message
CONFIG_NET_IPV4_FRAGMENT=y
# Two reassemblies at a time. With four INVITEs arriving at once the third
# and fourth lose a fragment, which the server resends half a second later,
# so a burst is taken two calls at a time; letting all four in at once
# needs far more receive buffers for the RTP that arrives while they are
# being answered
CONFIG_NET_IPV4_FRAGMENT_MAX_COUNT=2
CONFIG_NET_IPV4_FRAGMENT_MAX_PKT=8

# Static address on the link to the host (192.0.2.0/24 is TEST-NET-1)
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.0.2.1"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_NET_CONFIG_MY_IPV4_GW="192.0.2.2"
CONFIG_NET_CONFIG_PEER_IPV4_ADDR="192.0.2.2"

# Memory: PJLIB pools come from the C library heap. Registered and idle the
# sample uses about 20 KB of it and each call about 46 KB. The arena is
# sized in the sample's Kconfig, per feature set, to the peak measured with
# the four calls MAX_CALLS allows arriving at once plus 5% for the heap's
# own bookkeeping (README_Zephyr.md has the figures); set it here to
# override.
CONFIG_MAIN_STACK_SIZE=16384

# Random numbers for the emulator only; a real board uses its RNG
CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y

# Console
CONFIG_PRINTK=y
CONFIG_LOG=n
