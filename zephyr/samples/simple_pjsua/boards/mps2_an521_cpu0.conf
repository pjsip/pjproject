# The AN521 as QEMU emulates it, with its Ethernet attached to a TAP
# interface on the host. Static address on that link (192.0.2.0/24 is
# TEST-NET-1); there is no DHCP server on it. The host side is set up in
# README_Zephyr.md
CONFIG_NET_DHCPV4=n
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.0.2.1"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_NET_CONFIG_MY_IPV4_GW="192.0.2.2"
CONFIG_NET_CONFIG_PEER_IPV4_ADDR="192.0.2.2"

# A thread stack overflow faults instead of corrupting memory
CONFIG_HW_STACK_PROTECTION=y

# QEMU's networking is the board's Ethernet on the TAP: on Zephyr 4.4 the
# default for a QEMU target is SLIP over a UART pipe
CONFIG_NET_QEMU_ETHERNET=y
