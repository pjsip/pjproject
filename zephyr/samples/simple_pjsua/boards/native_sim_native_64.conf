# native_sim's Ethernet is a TAP interface on the host. Static address on
# that link (192.0.2.0/24 is TEST-NET-1); there is no DHCP server on it.
# The host side is set up in README_Zephyr.md
CONFIG_NET_DHCPV4=n
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.0.2.1"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_NET_CONFIG_MY_IPV4_GW="192.0.2.2"
CONFIG_NET_CONFIG_PEER_IPV4_ADDR="192.0.2.2"

# A 64-bit host: pointers twice the size, so the pools and everything in
# them are larger than on the Cortex-M the arena is sized for in Kconfig
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=262144
