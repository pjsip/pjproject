# PJSIP with threads, on the POSIX layer: pjsua-lib runs its SIP endpoint
# from a worker thread and the media from the sound device's clock thread
CONFIG_POSIX_API=y
CONFIG_PJPROJECT=y
CONFIG_PJPROJECT_THREADS=y

# Compiler thread-local storage comes off the top of every thread's stack,
# kernel threads included: pjlib's per-thread data is about 270 bytes,
# more than the idle thread's default stack of 256
CONFIG_IDLE_STACK_SIZE=1024

# pthread stacks are allocated from the kernel heap. A thread created
# without a stack size, as pjlib does with stack_size 0, gets
# DYNAMIC_THREAD_STACK_SIZE
CONFIG_THREAD_STACK_INFO=y
CONFIG_DYNAMIC_THREAD=y
CONFIG_DYNAMIC_THREAD_ALLOC=y
CONFIG_DYNAMIC_THREAD_STACK_SIZE=16384

# Zephyr's defaults are 5 each; pjsua-lib creates a lock per object, and
# pthread_mutex_init() fails with ENOMEM when the pool is used up
CONFIG_MAX_PTHREAD_MUTEX_COUNT=256
CONFIG_MAX_PTHREAD_COND_COUNT=16

# Networking: IPv4 over Ethernet, UDP for SIP and RTP
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_TCP=n
CONFIG_NET_SOCKETS=y
CONFIG_NET_MAX_CONTEXTS=12
CONFIG_NET_MAX_CONN=12
CONFIG_ZVFS_OPEN_MAX=24
# select() is built on poll() and fails with ENOMEM beyond this many fds
CONFIG_ZVFS_POLL_MAX=16
# Packet buffers are 128 bytes each; a SIP INVITE with SDP takes about 15
# of them. Sized as embedded_ua's, for several INVITEs arriving at once
CONFIG_NET_PKT_RX_COUNT=96
CONFIG_NET_BUF_RX_COUNT=384
CONFIG_NET_PKT_TX_COUNT=24
CONFIG_NET_BUF_TX_COUNT=48
# Send whole Ethernet frames rather than Zephyr's default 576-byte IPv4
# datagrams, so an outgoing INVITE is two fragments instead of four
CONFIG_NET_IPV4_MTU=1500
# A SIP INVITE with SDP often exceeds the Ethernet MTU, so IPv4 fragments
# must be reassembled, and the buffers must hold a reassembled message
CONFIG_NET_IPV4_FRAGMENT=y
CONFIG_NET_IPV4_FRAGMENT_MAX_COUNT=2
CONFIG_NET_IPV4_FRAGMENT_MAX_PKT=8

# Address from the network's DHCP server, waited for before the sample
# starts. The emulated boards have no DHCP server on their TAP link and use
# a static address instead, set in boards/
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_DHCPV4=y

# Memory: PJLIB pools come from the C library heap, sized in the sample's
# Kconfig. pjsua_init() and pjsua_start() run in the main thread
CONFIG_MAIN_STACK_SIZE=16384

# The board's hardware random number generator: SIP Call-IDs and tags come
# from it. The emulated boards have none; the pjproject-target snippet gives
# them a stand-in
CONFIG_ENTROPY_GENERATOR=y

# Console
CONFIG_PRINTK=y
CONFIG_LOG=n
