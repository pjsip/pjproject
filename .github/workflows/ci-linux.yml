  cmake-build:
    runs-on: ubuntu-latest
    name: CMake / ${{ matrix.build_type }}
    env:
      # test.py: only the test that needs no endpoint or sound device
      PJSUA2_TEST_QUICK: 1
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
        include:
          # the Python and Java bindings
          - build_type: Release
            swig: -DPJ_BUILD_SWIG_PYTHON=ON -DPJ_BUILD_SWIG_JAVA=ON
    steps:
    - uses: actions/checkout@v5
    - name: config site
      run: echo -e "#define PJ_TODO(x)\n" > pjlib/include/pj/config_site.h
    - name: install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libssl-dev libopus-dev libvpx-dev ${{ matrix.swig && 'swig python3-dev' || '' }}
    - name: configure
      run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} ${{ matrix.swig }}
    - name: check options
      # an optional library that is not found is dropped without failing the
      # configure
      run: |
        for p in OPUS VPX; do
          grep "^PJMEDIA_WITH_${p}_CODEC:BOOL=ON$" build/CMakeCache.txt || {
            echo "::error::PJMEDIA_WITH_${p}_CODEC is not ON"; exit 1; }
          grep -E "^${p}_(LIBRARY|INCLUDE_DIR):" build/CMakeCache.txt
        done
    - name: build
      run: cmake --build build -j $(nproc)
    - name: check
      run: |
        file build/pjsip-apps/bin/pjsua
        ldd build/pjsip-apps/bin/pjsua
    - name: test bindings
      if: matrix.swig
      run: |
        cd build
        ctest --no-tests=error -R '^pjsua2-python$' --output-on-failure
        ctest --no-tests=error -R '^pjsua2-java$' --output-on-failure
    - name: install
      run: cmake --install build --prefix ${{ runner.temp }}/pj-install
    - name: test find_package
      run: |
        cmake -B build-consumer tests/cmake \
          -DCMAKE_PREFIX_PATH=${{ runner.temp }}/pj-install \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        cmake --build build-consumer --verbose
        ./build-consumer/test_consumer
        ./build-consumer/test_consumer2
    # The same consumer with pjproject built inside it, as add_subdirectory()
    # or FetchContent does: there the headers of each library sit in their own
    # directory, so a library a public header needs must be linked PUBLIC.
    - name: test add_subdirectory
      run: |
        cmake -B build-subdir tests/cmake \
          -DTEST_PJ_SOURCE_DIR=${{ github.workspace }} \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        cmake --build build-subdir -j $(nproc) --target test_consumer test_consumer2
        ./build-subdir/test_consumer
        ./build-subdir/test_consumer2
    - name: test pkg-config
      run: |
        prefix=${{ runner.temp }}/pj-install
        test -f "$prefix/lib/libpj.a" && test ! -e "$prefix/bin/libpj.a"
        export PKG_CONFIG_PATH="$prefix/lib/pkgconfig"
        cat "$PKG_CONFIG_PATH/libpjproject.pc"
        cc tests/cmake/test_consumer.c -o pc_consumer \
          $(pkg-config --static --cflags --libs libpjproject)
        ./pc_consumer
    - name: test installed bindings
      if: matrix.swig
      run: |
        set -o pipefail
        prefix=${{ runner.temp }}/pj-install
        pydir=$(dirname "$(find "$prefix" -name pjsua2.py)")
        javadir=$(dirname "$(find "$prefix" -name pjsua2.jar)")
        cd "${{ runner.temp }}"
        # -P: not from test.py's own folder, where make leaves a pjsua2.py
        PYTHONPATH="$pydir" python3 -P \
          "${{ github.workspace }}/pjsip-apps/src/swig/python/test.py"
        mkdir -p java-test
        javac -d java-test -cp "$javadir/pjsua2.jar" \
          "${{ github.workspace }}/pjsip-apps/src/swig/java/test.java"
        java -cp "$javadir/pjsua2.jar:java-test" \
          -Djava.library.path="$javadir" test | grep 'Hello world'

  # The pure C configuration: everything that needs C++ is left out, and
  # nothing left in may reference it.
  cmake-build-c-only:
    runs-on: ubuntu-latest
    name: CMake / C only
    steps:
    - uses: actions/checkout@v5
    - name: config site
      run: echo -e "#define PJ_TODO(x)\n" > pjlib/include/pj/config_site.h
    - name: install dependencies
      run: sudo apt-get update && sudo apt-get install -y libssl-dev
    - name: configure
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DPJ_WITH_CXX=OFF
    - name: check
      run: |
        if grep '^CMAKE_CXX_COMPILER' build/CMakeCache.txt; then exit 1; fi
        grep '^#define PJ_HAS_ATOMIC_QUEUE 0' build/pjlib/include/pj/compat/os_auto.h
    - name: build
      run: cmake --build build -j $(nproc)
    - name: install
      run: cmake --install build --prefix ${{ runner.temp }}/pj-install
    - name: test find_package
      run: |
        cmake -B build-consumer tests/cmake \
          -DCMAKE_PREFIX_PATH=${{ runner.temp }}/pj-install \
          -DCMAKE_BUILD_TYPE=Release
        cmake --build build-consumer --verbose
        ./build-consumer/test_consumer
        test ! -e build-consumer/test_consumer2
    - name: test pkg-config
      run: |
        export PKG_CONFIG_PATH="${{ runner.temp }}/pj-install/lib/pkgconfig"
        cat "$PKG_CONFIG_PATH/libpjproject.pc"
        if grep -e -lpjsua2 -e -lstdc++ "$PKG_CONFIG_PATH/libpjproject.pc"; then exit 1; fi
        cc tests/cmake/test_consumer.c -o pc_consumer \
          $(pkg-config --static --cflags --libs libpjproject)
        ./pc_consumer

  # What a configure generates must not depend on values an earlier configure
  # of the same build directory left in the cache; see
  # tests/cmake/reconfigure.sh.
  cmake-reconfigure:
    runs-on: ubuntu-latest
    name: CMake / reconfigure
    steps:
    - uses: actions/checkout@v5
    - name: install dependencies
      run: sudo apt-get update && sudo apt-get install -y libssl-dev libsrtp2-dev
    - name: reconfigure vs fresh configure
      run: tests/cmake/reconfigure.sh . ${{ runner.temp }}/reconfigure

  # Cross configure for a system CMake calls Generic (no OS, or an RTOS that
  # brings its own build system), with the Arm GNU toolchain Ubuntu packages.
  # A socket layer and pthreads come from the RTOS, so pjlib cannot link yet;
  # this guards the configure, the toolchain file, the generated headers and
  # the pjlib sources that need only the C library's headers.
  cmake-cross-arm-none-eabi:
    runs-on: ubuntu-latest
    name: CMake / cross arm-none-eabi
    steps:
    - uses: actions/checkout@v5
    - name: install toolchain
      run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi
    - name: configure
      run: |
        cmake -B build-cross --toolchain cmake/toolchains/arm-none-eabi.cmake \
          -DPJ_WITH_CXX=OFF -DPJ_BUILD_APPS=OFF -DBUILD_TESTING=OFF \
          -DPJLIB_WITH_SSL=
    - name: check
      # the toolchain's libm rather than the host's, no C++ compiler, and
      # the SIMD probe kept NEON away from Cortex-M
      run: |
        grep '^MATH_LIBRARY:FILEPATH=/usr/lib/arm-none-eabi/' build-cross/CMakeCache.txt
        if grep '^CMAKE_CXX_COMPILER' build-cross/CMakeCache.txt; then exit 1; fi
        flags=build-cross/third_party/webrtc/CMakeFiles/pj_webrtc.dir/flags.make
        test -f "$flags"
        if grep -e WEBRTC_HAS_NEON -e -mfpu=neon "$flags"; then exit 1; fi
    - name: build
      run: cmake --build build-cross --target pj_resample -j $(nproc)
    - name: check target
      run: |
        arm-none-eabi-readelf -A build-cross/third_party/lib/libresample.a | grep 'Tag_CPU_name: "8-M.MAIN"'
    - name: build pjlib (libc-only files)
      # Compile only, nothing links. The files that include pj/sock.h need a
      # socket API and os_core_unix.c needs pthreads, which an RTOS supplies;
      # every other file must compile against the C library's headers alone.
      run: |
        cmake --build build-cross --target pjlib -j $(nproc) -- -k > pjlib.log 2>&1 || true
        grep -oE '\*\*\* \[[^]]*src/pj/[a-z_0-9]+\.c\.obj?\]' pjlib.log || true
        for f in array.c atomic_slist.c config.c ctype.c errno.c except.c fifobuf.c \
        file_access_unistd.c file_io_ansi.c guid.c guid_simple.c hash.c \
        list.c lock.c log.c log_writer_stdout.c os_error_unix.c os_info.c \
        os_time_common.c os_time_unix.c os_timestamp_common.c \
        os_timestamp_posix.c pool.c pool_buf.c pool_caching.c pool_dbg.c \
        pool_policy_malloc.c rand.c rbtree.c sock_select.c string.c timer.c \
        types.c unittest.c; do
          find build-cross/pjlib -name "$f.o" -o -name "$f.obj" | grep -q . || { echo "$f did not compile"; failed=1; }
        done
        test -z "$failed"
    - name: configure for Cortex-M33 with its FPU
      # hard-float flags let arm_neon.h compile, so only the probe's own
      # NEON test keeps the NEON sources out. The cache is seeded with what
      # an older probe recorded for this target; it must be discarded.
      run: |
        cmake -B build-cross-fpu --toolchain cmake/toolchains/arm-none-eabi.cmake \
          --no-warn-unused-cli \
          "-DPJ_TARGET_CPU_FLAGS=-mcpu=cortex-m33 -mthumb -mfpu=fpv5-sp-d16 -mfloat-abi=hard" \
          -DPJ_WITH_CXX=OFF -DPJ_BUILD_APPS=OFF -DBUILD_TESTING=OFF \
          -DPJLIB_WITH_SSL= \
          -D_pj_detected_simd_ext:INTERNAL=neon \
          -D_pj_detected_simd_ext_flags:INTERNAL=-mfpu=neon \
          -D_simd_supported:INTERNAL=1
        flags=build-cross-fpu/third_party/webrtc/CMakeFiles/pj_webrtc.dir/flags.make
        test -f "$flags"
        if grep -e WEBRTC_HAS_NEON -e -mfpu=neon "$flags"; then exit 1; fi
    - name: configure without bundled dependencies
      run: |
        cmake -B build-cross-min --toolchain cmake/toolchains/arm-none-eabi.cmake \
          -DPJ_WITH_CXX=OFF -DPJ_BUILD_APPS=OFF -DBUILD_TESTING=OFF \
          -DPJLIB_WITH_SSL= \
          -DPJ_DEP_G7221=none -DPJ_DEP_GSM=none -DPJ_DEP_ILBC=none \
          -DPJ_DEP_RESAMPLE=none -DPJ_DEP_SPEEX=none -DPJ_DEP_SRTP=none \
          -DPJ_DEP_WEBRTC=none -DPJMEDIA_WITH_VIDEO=OFF

  # A shared install must work on its own: with no LD_LIBRARY_PATH, the
  # installed pjsua and the libraries find each other and the bundled ones in
  # lib/pjproject/third_party through their RUNPATH, also from a copy of the
  # install made elsewhere. So must the installed Python and Java bindings.
  cmake-shared:
    needs: [detect-changes]
    if: github.event_name != 'pull_request' || needs.detect-changes.outputs.cmake == 'true'
    runs-on: ubuntu-latest
    name: CMake / shared
    env:
      # test.py: only the test that needs no endpoint or sound device
      PJSUA2_TEST_QUICK: 1
    steps:
    - uses: actions/checkout@v5
    - name: config site
      run: echo -e "#define PJ_TODO(x)\n" > pjlib/include/pj/config_site.h
    - name: install dependencies
      run: sudo apt-get update && sudo apt-get install -y libssl-dev swig python3-dev
    - name: configure
      run: >-
        cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON
        -DPJ_BUILD_SWIG_PYTHON=ON -DPJ_BUILD_SWIG_JAVA=ON
    - name: build
      run: cmake --build build -j $(nproc)
    - name: test bindings
      run: |
        cd build
        ctest --no-tests=error -R '^pjsua2-python$' --output-on-failure
        ctest --no-tests=error -R '^pjsua2-java$' --output-on-failure
    - name: install
      run: cmake --install build --prefix ${{ runner.temp }}/pj-install
    - name: test installed pjsua
      run: |
        prefix=${{ runner.temp }}/pj-install
        test -f "$prefix/lib/libpj.so"
        test ! -e "$prefix/lib/libpj.a"
        for f in "$prefix/bin/pjsua" "$prefix"/lib/*.so "$prefix"/lib/pjproject/third_party/*.so; do
          if ! readelf -d "$f" | grep -E '\((RUNPATH|RPATH)\)'; then
            echo "::error::$f has no RUNPATH"
            exit 1
          fi
        done
        if readelf -d "$prefix/bin/pjsua" "$prefix"/lib/*.so "$prefix"/lib/pjproject/third_party/*.so |
            grep -F "${{ github.workspace }}"; then
          echo "::error::the install refers to the build tree"
          exit 1
        fi
        "$prefix/bin/pjsua" --version > /dev/null
        mv "$prefix" "${{ runner.temp }}/pj-moved"
        "${{ runner.temp }}/pj-moved/bin/pjsua" --version > /dev/null
        mv "${{ runner.temp }}/pj-moved" "$prefix"
    - name: test find_package
      run: |
        cmake -B build-consumer tests/cmake \
          -DCMAKE_PREFIX_PATH=${{ runner.temp }}/pj-install \
          -DCMAKE_BUILD_TYPE=Release
        cmake --build build-consumer --verbose
        ./build-consumer/test_consumer
        ./build-consumer/test_consumer2
    - name: test pkg-config
      run: |
        prefix=${{ runner.temp }}/pj-install
        export PKG_CONFIG_PATH="$prefix/lib/pkgconfig"
        cat "$PKG_CONFIG_PATH/libpjproject.pc"
        cc tests/cmake/test_consumer.c -o pc_consumer \
          $(pkg-config --cflags --libs libpjproject) -Wl,-rpath,"$prefix/lib"
        ./pc_consumer
    - name: test installed bindings
      run: |
        set -o pipefail
        prefix=${{ runner.temp }}/pj-install
        pydir=$(dirname "$(find "$prefix" -name pjsua2.py)")
        javadir=$(dirname "$(find "$prefix" -name pjsua2.jar)")
        cd "${{ runner.temp }}"
        # -P: not from test.py's own folder, where make leaves a pjsua2.py
        PYTHONPATH="$pydir" python3 -P \
          "${{ github.workspace }}/pjsip-apps/src/swig/python/test.py"
        mkdir -p java-test
        javac -d java-test -cp "$javadir/pjsua2.jar" \
          "${{ github.workspace }}/pjsip-apps/src/swig/java/test.java"
        java -cp "$javadir/pjsua2.jar:java-test" \
          -Djava.library.path="$javadir" test | grep 'Hello world'

  # PJLIB_WITH_THREADS=OFF: as in the autoconf no-threads job, nothing may
  # reference pthread. Also the installed package: Pj's config must not ask
  # for Threads, and consumers built from it stay pthread-free.
  cmake-no-threads:
    needs: [detect-changes]
    if: github.event_name != 'pull_request' || needs.detect-changes.outputs.cmake == 'true'
    runs-on: ubuntu-latest
    name: CMake / no threads
    steps:
    - uses: actions/checkout@v5
    - name: config site
      run: echo -e "#define PJ_TODO(x)\n" > pjlib/include/pj/config_site.h
    - name: install dependencies
      run: sudo apt-get update && sudo apt-get install -y libssl-dev
    - name: configure
      # libwebrtc uses pthread_once() and is not built without threads.
      run: >-
        cmake -B build -DCMAKE_BUILD_TYPE=Release -DPJLIB_WITH_THREADS=OFF
        -DPJMEDIA_WITH_WEBRTC_AEC=OFF -DPJMEDIA_WITH_WEBRTC_AEC3=OFF
    - name: build
      run: cmake --build build -j $(nproc)
    - name: install
      run: cmake --install build --prefix ${{ runner.temp }}/pj-install
    - name: build consumers
      run: |
        cmake -B build-consumer tests/cmake \
          -DCMAKE_PREFIX_PATH=${{ runner.temp }}/pj-install \
          -DCMAKE_BUILD_TYPE=Release
        cmake --build build-consumer --verbose
        export PKG_CONFIG_PATH="${{ runner.temp }}/pj-install/lib/pkgconfig"
        cat "$PKG_CONFIG_PATH/libpjproject.pc"
        cc tests/cmake/test_consumer.c -o pc_consumer \
          $(pkg-config --static --cflags --libs libpjproject)
    - name: check the install does not ask for threads
      # glibc has pthread in libc, so the nm check below misses these
      run: |
        if grep '^FIND_PACKAGE_MESSAGE_DETAILS_Threads' build-consumer/CMakeCache.txt; then
          echo "::error::the installed Pj package looks up Threads"
          exit 1
        fi
        if grep -E -- '-l?pthread' "${{ runner.temp }}/pj-install/lib/pkgconfig/libpjproject.pc"; then
          echo "::error::libpjproject.pc links pthread"
          exit 1
        fi
    - name: check nothing references pthread
      run: |
        rc=0
        for bin in build/pjlib/bin/pjlib-test \
                   build/pjlib-util/bin/pjlib-util-test \
                   build/pjnath/bin/pjnath-test \
                   build/pjmedia/bin/pjmedia-test \
                   build/pjsip/bin/pjsip-test \
                   build/pjsip/bin/pjsua2-test \
                   build/pjsip-apps/bin/pjsua \
                   build-consumer/test_consumer \
                   build-consumer/test_consumer2 \
                   pc_consumer; do
          if [ ! -f "$bin" ]; then
            echo "::error::$bin was not built"
            rc=1
            continue
          fi
          if nm -D -u "$bin" | grep -E ' U (pthread_|sched_get)'; then
            echo "::error::$bin references pthread with PJLIB_WITH_THREADS=OFF"
            rc=1
          else
            echo "ok: $bin"
          fi
        done
        exit $rc
    - name: run
      run: |
        ./build-consumer/test_consumer
        ./build-consumer/test_consumer2
        ./pc_consumer
        cd pjlib-util/build
        ../../build/pjlib-util/bin/pjlib-util-test --ci-mode resolver_nothreads_test

  # The bundled libraries that can come from the system (GSM, Speex with
  # SpeexDSP, libsrtp2, libyuv), all from Ubuntu's packages. Not libresample:
  # Ubuntu's libresample1-dev is an unrelated library of the same name.
  # Asked for by name, a missing one stops the configure. None may be built
  # from third_party, and the build and the consumers must load the system
  # copies.
  # Also Opus and libvpx, as in cmake-build, with the build pointed at each
  # library by <Pkg>_ROOT: its packages unpacked into a folder of its own.
  # The system's copies are installed too, and must not be used: not by the
  # build, and not by the consumers, which get only the pjproject install.
  cmake-system-deps:
    needs: [detect-changes]
    if: github.event_name != 'pull_request' || needs.detect-changes.outputs.cmake == 'true'
    runs-on: ubuntu-latest
    name: CMake / system GSM, Speex, SRTP, libyuv; Opus + VPX from <Pkg>_ROOT
    env:
      PJ_SYSTEM_LIBS: gsm speex speexdsp srtp2 yuv
    steps:
    - uses: actions/checkout@v5
    - name: config site
      run: echo -e "#define PJ_TODO(x)\n" > pjlib/include/pj/config_site.h
    - name: install dependencies
      run: >-
        sudo apt-get update && sudo apt-get install -y libssl-dev
        libgsm1-dev libspeex-dev libspeexdsp-dev libsrtp2-dev libyuv-dev
        libopus-dev libvpx-dev
    - name: package roots
      # the -dev package and the library package it depends on
      run: |
        r=${{ runner.temp }}/roots
        mkdir -p $r/debs
        cd $r/debs
        for p in opus vpx; do
          dev=lib$p-dev
          lib=$(apt-cache depends $dev |
                awk -v re="^lib$p[0-9]" '$1 == "Depends:" && $2 ~ re { print $2; exit }')
          apt-get download $dev $lib
          for deb in ${dev}_*.deb ${lib}_*.deb; do dpkg -x $deb $r/$p; done
        done
        find $r/opus $r/vpx -name 'lib*.so*'
    - name: configure
      run: >-
        cmake -B build -DCMAKE_BUILD_TYPE=Release
        -DPJ_DEP_GSM=system -DPJ_DEP_SPEEX=system -DPJ_DEP_SRTP=system
        -DPJ_DEP_YUV=system
        -DOPUS_ROOT=${{ runner.temp }}/roots/opus/usr
        -DVPX_ROOT=${{ runner.temp }}/roots/vpx/usr
    - name: check options
      run: |
        cache=build/CMakeCache.txt
        failed=0
        for v in GSM Speex SpeexDSP SRTP YUV; do
          path=$(sed -n "s/^${v}_LIBRARY:[^=]*=//p" $cache)
          echo "${v}_LIBRARY=$path"
          case "$path" in /usr/*) ;; *)
            echo "::error::${v}_LIBRARY is not a system library"; failed=1 ;;
          esac
        done
        # system Speex has its echo canceller in SpeexDSP
        grep -x 'PJMEDIA_WITH_SPEEX_AEC:BOOL=ON' $cache || {
          echo "::error::PJMEDIA_WITH_SPEEX_AEC is not ON"; failed=1; }
        exit $failed
    - name: check the roots
      # Opus and libvpx: the library and the headers from the root
      run: |
        for p in OPUS VPX; do
          grep "^PJMEDIA_WITH_${p}_CODEC:BOOL=ON$" build/CMakeCache.txt || {
            echo "::error::PJMEDIA_WITH_${p}_CODEC is not ON"; exit 1; }
          root=$(sed -n "s/^${p}_ROOT:[A-Z]*=//p" build/CMakeCache.txt)
          [ -n "$root" ] || { echo "::error::${p}_ROOT is not set"; exit 1; }
          for v in LIBRARY INCLUDE_DIR; do
            grep "^${p}_$v:[A-Z]*=$root/" build/CMakeCache.txt || {
              echo "::error::${p}_$v is not under $root"; exit 1; }
          done
        done
    - name: build
      run: cmake --build build -j $(nproc)
    - name: check build
      run: |
        failed=0
        for l in gsm speex srtp yuv; do
          if f=$(find build -name "lib$l.a" | grep .); then
            echo "::error::the bundled $l was built: $f"; failed=1
          fi
        done
        ldd build/pjsip-apps/bin/pjsua
        for l in $PJ_SYSTEM_LIBS; do
          ldd build/pjsip-apps/bin/pjsua | grep -q "lib$l\.so.* => /" || {
            echo "::error::pjsua does not load the system lib$l"; failed=1; }
        done
        exit $failed
    - name: run pjsua
      run: ./build/pjsip-apps/bin/pjsua --version
    - name: install
      run: cmake --install build --prefix ${{ runner.temp }}/pj-install
    - name: check install
      run: |
        ls -R ${{ runner.temp }}/pj-install/lib/pjproject/third_party || true
        for l in gsm speex srtp yuv; do
          if f=$(find ${{ runner.temp }}/pj-install -name "lib$l.a" | grep .); then
            echo "::error::the bundled $l was installed: $f"; exit 1
          fi
        done
    - name: test find_package
      run: |
        cmake -B build-consumer tests/cmake \
          -DCMAKE_PREFIX_PATH=${{ runner.temp }}/pj-install \
          -DCMAKE_BUILD_TYPE=Release
        cmake --build build-consumer --verbose
        ./build-consumer/test_consumer
        ./build-consumer/test_consumer2
    - name: test pkg-config
      run: |
        export PKG_CONFIG_PATH="${{ runner.temp }}/pj-install/lib/pkgconfig"
        cat "$PKG_CONFIG_PATH/libpjproject.pc"
        # the roots are not searched at run time
        cc tests/cmake/test_consumer.c -o pc_consumer \
          $(pkg-config --static --cflags --libs libpjproject) \
          $(pkg-config --static --libs-only-L libpjproject | sed 's/-L/-Wl,-rpath,/g')
        ./pc_consumer
    - name: check the consumers load the system libraries
      run: |
        failed=0
        for exe in build-consumer/test_consumer build-consumer/test_consumer2 \
                   pc_consumer; do
          for l in $PJ_SYSTEM_LIBS; do
            ldd $exe | grep -q "lib$l\.so.* => /" || {
              echo "::error::$exe does not load the system lib$l"; failed=1; }
          done
        done
        exit $failed
    - name: check the consumers used the roots
      # and not the system's copies, which are installed too
      run: |
        export PKG_CONFIG_PATH="${{ runner.temp }}/pj-install/lib/pkgconfig"
        for p in OPUS VPX; do
          root=$(sed -n "s/^${p}_ROOT:[A-Z]*=//p" build/CMakeCache.txt)
          found=$(sed -n "s/^FIND_PACKAGE_MESSAGE_DETAILS_${p}:INTERNAL=//p" \
                  build-consumer/CMakeCache.txt)
          echo "find_package consumer, $p: $found"
          paths=$(echo "$found" | grep -o '\[/[^]]*\]' | tr -d '[]')
          [ -n "$paths" ] || { echo "::error::no $p paths in the consumer"; exit 1; }
          for f in $paths; do
            case $f in
              "$root"/*) ;;
              *) echo "::error::find_package consumer: $f is not under $root"; exit 1 ;;
            esac
          done
          pkg-config --static --libs-only-L libpjproject | tr ' ' '\n' | grep -- "^-L$root/" || {
            echo "::error::libpjproject.pc has no -L under $root"; exit 1; }
          lib=lib$(echo $p | tr A-Z a-z).so
          for exe in build-consumer/test_consumer pc_consumer; do
            ldd $exe | grep "$lib" | grep -- "=> $root/" || {
              echo "::error::$exe does not load $lib from $root"; exit 1; }
          done
        done

  # Short pjsua-stress runs under ASan/TSan on every PR / push to master.
  # The full weekly run (larger fleet, longer duration) lives in
  # .github/workflows/stress-test.yml.
  stress-asan:
    needs: [detect-changes]
    if: github.event_name != 'pull_request' || needs.detect-changes.outputs.any_src == 'true'
    runs-on: ubuntu-latest
    name: stress / asan
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v5
    - name: install dependencies
      run: sudo apt-get update && sudo apt-get install -y nasm gdb
    - name: get openh264
      run: git clone --depth 1 --single-branch --branch openh264v2.1.0 https://github.com/cisco/openh264.git
    - name: build openh264
      run: cd openh264 && $MAKE_FAST && sudo make install && sudo ldconfig
    - name: config site
      run: cp pjlib/include/pj/config_site_stress.h pjlib/include/pj/config_site.h
    - name: configure
      run: |
        CFLAGS="-g -fsanitize=address" \
        CXXFLAGS="-g -fsanitize=address" \
        LDFLAGS="-rdynamic -fsanitize=address" \
        ./configure --enable-epoll
    - name: make
      run: $MAKE_FAST
    - name: run pjsua-stress
      run: |
        set -eo pipefail
        export LSAN_OPTIONS="suppressions=$GITHUB_WORKSPACE/tests/sanitizers/lsan.supp"
        export ASAN_OPTIONS="halt_on_error=1"
        ARCH=$(make --no-print-directory -s infotarget)
        cd pjsip/bin
        # Run in the background (log streamed to the console by tail) so a
        # watchdog can dump thread stacks and kill the binary if it hangs.
        # Without this a deadlock is a silent 45-minute job timeout with no
        # diagnostics. A healthy run finishes in ~8 minutes (ramp is capped
        # at 5 min by the binary, stress phase is 6 min), so 15 is generous.
        # Don't wrap this in stdbuf: it injects LD_PRELOAD=libstdbuf.so,
        # which trips the ASan/TSan runtime link-order check and aborts the
        # binary at startup ("ASan runtime does not come first").
        ./pjsua-stress-$ARCH -n 512 -v 16 -t 4 --duration 360 --log-level 4 > stress.log 2>&1 &
        app_pid=$!
        tail --pid=$app_pid -n +1 -f stress.log &
        (
          sleep 900
          if kill -0 $app_pid 2>/dev/null; then
            {
              echo ""
              echo "=== pjsua_stress watchdog: still running after 900 s, dumping thread stacks ==="
              sudo gdb -p $app_pid -batch -ex "thread apply all bt" 2>&1
            } >> stress.log
            touch watchdog.fired
            kill -9 $app_pid 2>/dev/null
          fi
        ) > /dev/null 2>&1 &
        watchdog_pid=$!
        # Temporarily disable errexit so a crashed binary doesn't kill the
        # step before we capture the exit code and decode the backtrace.
        set +e
        wait $app_pid
        rc=$?
        set -e
        kill $watchdog_pid 2>/dev/null || true
        if [ -f watchdog.fired ]; then
          echo "::error::pjsua-stress hung; watchdog killed it after 900 s, thread stacks are in the uploaded stress.log"
          exit 124
        fi
        # If our crash handler dumped a backtrace, resolve the static-frame
        # offsets via addr2line so the names land in the uploaded log.
        if grep -q "=== pjsua_stress backtrace ===" stress.log; then
          OFFSETS=$(grep -oE "\./pjsua-stress[^(]*\(\+0x[0-9a-fA-F]+\)" stress.log \
                    | grep -oE "0x[0-9a-fA-F]+" || true)
          if [ -n "$OFFSETS" ]; then
            echo "" >> stress.log
            echo "=== addr2line resolved frames ===" >> stress.log
            addr2line -e "./pjsua-stress-$ARCH" -f -p -i $OFFSETS >> stress.log 2>&1 || true
          fi
        fi
        if [ "$rc" -ne 0 ]; then
          echo "::error::pjsua-stress exited with code $rc; see uploaded stress.log"
          exit "$rc"
        fi
        # Belt-and-suspenders: catch libc assertions and sanitizer reports
        # even if the binary somehow exited 0.
        if grep -qE "Assertion .* failed|ERROR: AddressSanitizer|ERROR: LeakSanitizer" stress.log; then
          echo "::error::Assertion or AddressSanitizer report found in stress.log"
          grep -nE "Assertion .* failed|ERROR: AddressSanitizer|ERROR: LeakSanitizer|SUMMARY: AddressSanitizer" stress.log
          exit 1
        fi
    - name: upload log
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: stress-asan-log-${{ github.run_id }}
        path: pjsip/bin/stress.log

  stress-tsan:
    needs: [detect-changes]
    if: github.event_name != 'pull_request' || needs.detect-changes.outputs.any_src == 'true'
    runs-on: ubuntu-latest
    name: stress / tsan
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v5
    - name: install dependencies
      run: sudo apt-get update && sudo apt-get install -y nasm gdb
    - name: get openh264
      run: git clone --depth 1 --single-branch --branch openh264v2.1.0 https://github.com/cisco/openh264.git
    - name: build openh264
      run: cd openh264 && $MAKE_FAST && sudo make install && sudo ldconfig
    - name: config site
      run: cp pjlib/include/pj/config_site_stress.h pjlib/include/pj/config_site.h
    - name: configure
      run: |
        CFLAGS="-g -fsanitize=thread" \
        CXXFLAGS="-g -fsanitize=thread" \
        LDFLAGS="-rdynamic -fsanitize=thread" \
        ./configure --enable-epoll
    - name: make
      run: $MAKE_FAST
    - name: run pjsua-stress
      run: |
        set -eo pipefail
        export TSAN_OPTIONS="suppressions=$GITHUB_WORKSPACE/tests/sanitizers/tsan.supp halt_on_error=1"
        ARCH=$(make --no-print-directory -s infotarget)
        cd pjsip/bin
        # Run in the background (log streamed to the console by tail) so a
        # watchdog can dump thread stacks and kill the binary if it hangs.
        # Without this a deadlock is a silent 45-minute job timeout with no
        # diagnostics. A healthy run finishes in ~8 minutes (ramp is capped
        # at 5 min by the binary, stress phase is 6 min), so 15 is generous.
        # Don't wrap this in stdbuf: it injects LD_PRELOAD=libstdbuf.so,
        # which trips the ASan/TSan runtime link-order check and aborts the
        # binary at startup ("ASan runtime does not come first").
        ./pjsua-stress-$ARCH -n 512 -v 16 -t 4 --duration 360 --log-level 4 > stress.log 2>&1 &
        app_pid=$!
        tail --pid=$app_pid -n +1 -f stress.log &
        (
          sleep 900
          if kill -0 $app_pid 2>/dev/null; then
            {
              echo ""
              echo "=== pjsua_stress watchdog: still running after 900 s, dumping thread stacks ==="
              sudo gdb -p $app_pid -batch -ex "thread apply all bt" 2>&1
            } >> stress.log
            touch watchdog.fired
            kill -9 $app_pid 2>/dev/null
          fi
        ) > /dev/null 2>&1 &
        watchdog_pid=$!
        # Temporarily disable errexit so a crashed binary doesn't kill the
        # step before we capture the exit code and decode the backtrace.
        set +e
        wait $app_pid
        rc=$?
        set -e
        kill $watchdog_pid 2>/dev/null || true
        if [ -f watchdog.fired ]; then
          echo "::error::pjsua-stress hung; watchdog killed it after 900 s, thread stacks are in the uploaded stress.log"
          exit 124
        fi
        # If our crash handler dumped a backtrace, resolve the static-frame
        # offsets via addr2line so the names land in the uploaded log.
        if grep -q "=== pjsua_stress backtrace ===" stress.log; then
          OFFSETS=$(grep -oE "\./pjsua-stress[^(]*\(\+0x[0-9a-fA-F]+\)" stress.log \
                    | grep -oE "0x[0-9a-fA-F]+" || true)
          if [ -n "$OFFSETS" ]; then
            echo "" >> stress.log
            echo "=== addr2line resolved frames ===" >> stress.log
            addr2line -e "./pjsua-stress-$ARCH" -f -p -i $OFFSETS >> stress.log 2>&1 || true
          fi
        fi
        if [ "$rc" -ne 0 ]; then
          echo "::error::pjsua-stress exited with code $rc; see uploaded stress.log"
          exit "$rc"
        fi
        # Belt-and-suspenders: catch libc assertions and TSan reports even
        # if the binary somehow exited 0 (halt_on_error doesn't always abort
        # on lock-order-inversion warnings).
        if grep -qE "Assertion .* failed|WARNING: ThreadSanitizer|ERROR: ThreadSanitizer" stress.log; then
          echo "::error::Assertion or ThreadSanitizer report found in stress.log"
          grep -nE "Assertion .* failed|WARNING: ThreadSanitizer|ERROR: ThreadSanitizer|SUMMARY: ThreadSanitizer" stress.log
          exit 1
        fi
    - name: upload log
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: stress-tsan-log-${{ github.run_id }}
        path: pjsip/bin/stress.log
