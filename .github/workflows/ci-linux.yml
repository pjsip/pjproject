name: CI Ubuntu
on:
  push:
    branches:
      - 'master'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# Cancel superseded runs on the same ref (e.g. a force-push to a PR) so they
# stop holding CI runner slots.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_ARGS: -w 3 --shuffle --stdout-buf 1
  CI_MODE: --ci-mode
  # Setting CI_RUNNER to empty should disable cirunner
  CI_RUNNER: python ${{ github.workspace }}/cirunner/cirunner.py -t 3600 -o ${{ github.workspace }}/artifacts --
  MAKE_FAST: make -j 3
jobs:
  # Draft PRs run the build only jobs. Skipping this job skips every test job
  # that needs it.
  detect-changes:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    outputs:
      # Aggregate dependency groups — each combines the raw path filters
      # relevant to a set of test jobs, so per-job conditions are one-liners.
      pjlib_deps: ${{ steps.filter.outputs.core == 'true' || steps.filter.outputs.tests == 'true' || steps.filter.outputs.ci == 'true' }}
      pjnath_deps: ${{ steps.filter.outputs.core == 'true' || steps.filter.outputs.pjlib_util == 'true' || steps.filter.outputs.pjnath == 'true' || steps.filter.outputs.tests == 'true' || steps.filter.outputs.ci == 'true' }}
      pjmedia_deps: ${{ steps.filter.outputs.core == 'true' || steps.filter.outputs.pjlib_util == 'true' || steps.filter.outputs.pjmedia == 'true' || steps.filter.outputs.tests == 'true' || steps.filter.outputs.ci == 'true' }}
      pjsip_deps: ${{ steps.filter.outputs.core == 'true' || steps.filter.outputs.pjlib_util == 'true' || steps.filter.outputs.pjsip == 'true' || steps.filter.outputs.tests == 'true' || steps.filter.outputs.ci == 'true' }}
      pjmedia_pjsip_deps: ${{ steps.filter.outputs.core == 'true' || steps.filter.outputs.pjlib_util == 'true' || steps.filter.outputs.pjmedia == 'true' || steps.filter.outputs.pjsip == 'true' || steps.filter.outputs.tests == 'true' || steps.filter.outputs.ci == 'true' }}
      pjnath_pjmedia_deps: ${{ steps.filter.outputs.core == 'true' || steps.filter.outputs.pjlib_util == 'true' || steps.filter.outputs.pjnath == 'true' || steps.filter.outputs.pjmedia == 'true' || steps.filter.outputs.tests == 'true' || steps.filter.outputs.ci == 'true' }}
      pjnath_pjsip_deps: ${{ steps.filter.outputs.core == 'true' || steps.filter.outputs.pjlib_util == 'true' || steps.filter.outputs.pjnath == 'true' || steps.filter.outputs.pjsip == 'true' || steps.filter.outputs.tests == 'true' || steps.filter.outputs.ci == 'true' }}
      any_src: ${{ steps.filter.outputs.core == 'true' || steps.filter.outputs.pjlib_util == 'true' || steps.filter.outputs.pjnath == 'true' || steps.filter.outputs.pjmedia == 'true' || steps.filter.outputs.pjsip == 'true' || steps.filter.outputs.pjsip_apps == 'true' || steps.filter.outputs.tests == 'true' || steps.filter.outputs.ci == 'true' }}
      cmake: ${{ steps.filter.outputs.cmake == 'true' }}
    steps:
    - uses: actions/checkout@v5
    - uses: dorny/paths-filter@v4
      if: github.event_name == 'pull_request'
      id: filter
      with:
        filters: |
          core:
            - 'pjlib/**'
            - 'build/**'
            - 'configure*'
            - 'aconfigure*'
            - 'Makefile'
            - '*.mak*'
            - 'third_party/**'
          pjlib_util:
            - 'pjlib-util/**'
          pjnath:
            - 'pjnath/**'
          pjmedia:
            - 'pjmedia/**'
          pjsip:
            - 'pjsip/**'
          pjsip_apps:
            - 'pjsip-apps/**'
          tests:
            - 'tests/**'
          ci:
            - '.github/**'
          cmake:
            - 'CMakeLists.txt'
            - '**/CMakeLists.txt'
            - 'cmake/**'
            - '**/*.cm'
            - 'libpjproject.pc.in'
            - 'tests/cmake/**'
            - '.github/**'

  default-build:
    # checking pure lib source distribution with plain configure & make
    runs-on: ubuntu-latest
    name: Default / build only
    steps:
    - uses: actions/checkout@v5
    - name: install cirunner
      run: |
        git clone --depth 1 https://github.com/pjsip/cirunner.git
        cirunner/installlinux.sh
    - name: config site
      run: echo -e "#define PJ_TODO(x)\n" > pjlib/include/pj/config_site.h
    - name: configure
      run: ./configure CFLAGS="-std=gnu89 -Werror=declaration-after-statement"
    - name: swig symbols.i drift check
      # symbols.i is autogenerated from symbols.lst by importsym2.py;
      # when a header adds/removes enum values or struct fields the
      # generator must be re-run, or the Java/Python/C# bindings
      # silently omit those symbols. Runs after configure so the
      # preprocessor can find pj/compat/os_auto.h.
      run: |
        cd pjsip-apps/src/swig
        cp symbols.i symbols.i.orig
        python3 importsym2.py symbols.lst symbols.i
        if ! diff -u symbols.i.orig symbols.i; then
          echo "::error::symbols.i is out of date. Run 'python3 importsym2.py symbols.lst symbols.i' in pjsip-apps/src/swig and commit the result. If you added new headers, update symbols.lst too."
          exit 1
        fi
    - name: make
      run: $MAKE_FAST
    - name: get SSL info
      run: pjlib/bin/pjlib-test-`make infotarget` --config --list | grep SSL
    - name: verify oepnssl is used
      run: pjlib/bin/pjlib-test-`make infotarget` --config --list | grep -E 'PJ_SSL_SOCK_IMP\s+:\s+1'
    - name: upload artifacts on failure
      if: ${{ failure() }}
      uses: actions/upload-artifact@v6
      with:
        name: ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ github.run_id }}
        path: artifacts

  default-full-bundle-1:
    # full bundle: enable all codecs + AEC + DTLS
    needs: [detect-changes]
    if: github.event_name != 'pull_request' || needs.detect-changes.outputs.any_src == 'true'
    runs-on: ubuntu-latest
    name: Default / pjsua
    steps:
    - uses: actions/checkout@v5
    - name: install cirunner
      run: |
        git clone --depth 1 https://github.com/pjsip/cirunner.git
        cirunner/installlinux.sh
    - name: install dependencies
      run: sudo apt-get update && sudo apt-get install -y swig sip-tester libopencore-amrnb-dev libopencore-amrwb-dev libvo-amrwbenc-dev
    - name: config site
      # Enable RTCP XR so scripts-call/415_call_rtcp_xr.py runs instead of
      # skipping (it skips unless PJMEDIA_HAS_RTCP_XR is compiled in; the
      # test then activates XR per-call via pjsua's --rtcp-xr option).
      run: |
        cd pjlib/include/pj
        cp config_site_test.h config_site.h
        echo "#define PJMEDIA_HAS_RTCP_XR 1" >> config_site.h
    - name: configure
      run: CFLAGS="-g -fPIC -fsanitize=address" CXXFLAGS="-g -fPIC -fsanitize=address" LDFLAGS="-rdynamic -fsanitize=address" ./configure --enable-libwebrtc-aec3
    - name: make
      run: $MAKE_FAST
    - name: swig bindings
      run: cd pjsip-apps/src/swig && make
    - name: set up Python 3.10 for pjsua test
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'
    - name: Install PESQ and Dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        python -m pip install numpy cython
        python -m pip install pesq scipy
    - name: Download and Unzip Visqol
      run: |
        curl -L "https://github.com/pjsip/third_party_libs/raw/main/visqol_ubuntu.zip" -o visqol.zip
        unzip -o visqol.zip -d tests/pjsua/tools
        chmod +x tests/pjsua/tools/visqol
    - name: capture pjsua capabilities
      run: |
        cat << EOF | pjsip-apps/bin/pjsua-`make infotarget` --log-level 3 > pjsua-caps
        Cp
        xx
        vid dev list
        vid codec list
        q
        EOF
        cat pjsua-caps
    - name: ensure AMR codec is installed
      run: cat pjsua-caps | grep -E 'AMR/8000'
    - name: ensure AMR-WB codec is installed
      run: cat pjsua-caps | grep -E 'AMR-WB/16000'
    - name: pjsua-test
      run: make pjsua-test
    - name: upload artifacts on failure
      if: ${{ failure() }}
      uses: actions/upload-artifact@v6
      with:
        name: ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ github.run_id }}
        path: artifacts

  default-full-bundle-2:
    needs: [detect-changes]
    if: github.event_name != 'pull_request' || needs.detect-changes.outputs.pjnath_deps == 'true'
    runs-on: ubuntu-latest
    name: Default / pjlib,util,pjnath
    steps:
    - uses: actions/checkout@v5
    - name: install cirunner
      run: |
        git clone --depth 1 https://github.com/pjsip/cirunner.git
        cirunner/installlinux.sh
    - name: install dependencies
      run: sudo apt-get install -y libopencore-amrnb-dev
    - name: config site
      run: cd pjlib/include/pj && cp config_site_test.h config_site.h
    - name: configure
      run: CFLAGS="-g -fsanitize=address" CXXFLAGS="-fsanitize=address" LDFLAGS="-rdynamic -fsanitize=address" ./configure
    - name: make
      run: $MAKE_FAST
    - name: pjlib-test
      run: |
        export LSAN_OPTIONS="suppressions=$GITHUB_WORKSPACE/tests/sanitizers/lsan.supp"
        make pjlib-test
    - name: pjlib-util-test
      run: make pjlib-util-test
    - name: pjnath-test
      run: make pjnath-test
    - name: upload artifacts on failure
      if: ${{ failure() }}
      uses: actions/upload-artifact@v6
      with:
        name: ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ github.run_id }}
        path: artifacts

  default-full-bundle-3:
    needs: [detect-changes]
    if: github.event_name != 'pull_request' || needs.detect-changes.outputs.pjmedia_pjsip_deps == 'true'
    runs-on: ubuntu-latest
    name: Default / pjmedia,pjsip
    steps:
    - uses: actions/checkout@v5
    - name: install cirunner
      run: |
        git clone --depth 1 https://github.com/pjsip/cirunner.git
        cirunner/installlinux.sh
    - name: install dependencies
      run: sudo apt-get update && sudo apt-get install -y libopencore-amrnb-dev libopus-dev
    - name: config site
      run: cd pjlib/include/pj && cp config_site_test.h config_site.h
    - name: configure
      run: CFLAGS="-g -fsanitize=address" CXXFLAGS="-fsanitize=address" LDFLAGS="-rdynamic -fsanitize=address" ./configure --enable-libwebrtc-aec3
    - name: make
      run: $MAKE_FAST
    - name: pjmedia-test
      run: make pjmedia-test
    - name: pjsip-test
      run: make pjsip-test
    - name: upload artifacts on failure
      if: ${{ failure() }}
      uses: actions/upload-artifact@v6
      with:
        name: ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ github.run_id }}
        path: artifacts

  no-tls:
    needs: [detect-changes]
    if: github.event_name != 'pull_request' || needs.detect-changes.outputs.pjsip_deps == 'true'
    runs-on: ubuntu-latest
    name: No SSL / pjlib,pjsip
    steps:
    - uses: actions/checkout@v5
    - name: install cirunner
      run: |
        git clone --depth 1 https://github.com/pjsip/cirunner.git
        cirunner/installlinux.sh
    - name: install dependencies
      run: sudo apt-get install -y swig
    - name: config site
      run: echo -e "#define PJ_TODO(x)\n" > pjlib/include/pj/config_site.h
    - name: configure
      run: CFLAGS="-fPIC" CXXFLAGS="-fPIC" ./configure --disable-ssl
    - name: make
      run: $MAKE_FAST
    - name: swig bindings
      run: cd pjsip-apps/src/swig && make
    - name: pjlib-test
      run: make pjlib-test
    - name: pjsip-test
      run: make pjsip-test
    - name: upload artifacts on failure
      if: ${{ failure() }}
      uses: actions/upload-artifact@v6
      with:
        name: ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ github.run_id }}
        path: artifacts

  no-fp:
    needs: [detect-changes]
    # any_src, not pjlib_deps: the no-FPU guarantee covers the upper layers
    # too, e.g. pj_math_stat is used by pjmedia's RTCP code.
    if: github.event_name != 'pull_request' || needs.detect-changes.outputs.any_src == 'true'
    runs-on: ubuntu-latest
    name: NoFP / pjlib
    steps:
    - uses: actions/checkout@v5
    - name: install cirunner
      run: |
        git clone --depth 1 https://github.com/pjsip/cirunner.git
        cirunner/installlinux.sh
    - name: config site
      run: echo -e "#define PJ_TODO(x)\n" > pjlib/include/pj/config_site.h
    - name: configure
      # Build-and-test check of the no-FP configuration; it does not detect FP
      # instructions on x86-64.
      run: ./configure --disable-floating-point
    - name: make
      run: $MAKE_FAST
    - name: pjlib-test
      run: make pjlib-test
    - name: upload artifacts on failure
      if: ${{ failure() }}
      uses: actions/upload-artifact@v6
      with:
        name: ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ github.run_id }}
        path: artifacts

  no-threads:
    needs: [detect-changes]
    # any_src, not pjlib_deps: the no-pthread guarantee covers the upper layers
    # too, e.g. pjmedia's alsa_dev.c.
    if: github.event_name != 'pull_request' || needs.detect-changes.outputs.any_src == 'true'
    runs-on: ubuntu-latest
    name: No threads / pjlib
    steps:
    - uses: actions/checkout@v5
    - name: install cirunner
      run: |
        git clone --depth 1 https://github.com/pjsip/cirunner.git
        cirunner/installlinux.sh
    - name: config site
      run: echo -e "#define PJ_TODO(x)\n" > pjlib/include/pj/config_site.h
    - name: configure
      # libwebrtc uses pthread_once() and is not built without threads.
      run: ./configure --disable-threads --disable-libwebrtc
    - name: make
      run: $MAKE_FAST
    - name: check nothing references pthread
      run: |
        t=$(make infotarget)
        rc=0
        for bin in pjlib/bin/pjlib-test-$t \
                   pjlib-util/bin/pjlib-util-test-$t \
                   pjnath/bin/pjnath-test-$t \
                   pjmedia/bin/pjmedia-test-$t \
                   pjsip/bin/pjsip-test-$t \
                   pjsip-apps/bin/pjsua-$t; do
          if [ ! -f "$bin" ]; then
            echo "::error::$bin was not built"
            rc=1
            continue
          fi
          if nm -D -u "$bin" | grep -E ' U (pthread_|sched_get)'; then
            echo "::error::$bin references pthread with PJ_HAS_THREADS=0;"\
                 "run 'nm -u -A <lib>.a' on its libraries to find the object"
            rc=1
          else
            echo "ok: $bin"
          fi
        done
        exit $rc
    - name: pjlib-test
      run: make pjlib-test
    - name: pjlib-util-test (resolver without threads)
      run: cd pjlib-util/build && ../bin/pjlib-util-test-`make -s -C ../.. infotarget` $CI_MODE resolver_nothreads_test
    - name: upload artifacts on failure
      if: ${{ failure() }}
      uses: actions/upload-artifact@v6
      with:
        name: ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ github.run_id }}
        path: artifacts

  # build-ubuntu-openssl
  # TLS: with OpenSSL (same as build-ubuntu-default)

  gnu-tls:
    needs: [detect-changes]
    if: github.event_name != 'pull_request' || needs.detect-changes.outputs.pjnath_pjsip_deps == 'true'
    runs-on: ubuntu-latest
    name: GnuTLS / pjlib,pjnath,pjsip + CMake
    steps:
    - uses: actions/checkout@v5
    - name: config site
      run: echo -e "#define PJ_TODO(x)\n" > pjlib/include/pj/config_site.h
    - name: install cirunner
      run: |
        git clone --depth 1 https://github.com/pjsip/cirunner.git
        cirunner/installlinux.sh
    - name: install dependencies
      run: sudo apt-get update && sudo apt-get install -y --fix-missing swig libgnutls28-dev
    # The same backend with CMake, before the autotools build writes its
    # headers into the source tree. Asked for by name, a backend that is not
    # found stops the configure. The consumers get only the pjproject
    # install: its package must find the backend again.
    - name: cmake configure
      run: >-
        cmake -B build-cmake -DCMAKE_BUILD_TYPE=Release
        -DPJLIB_WITH_SSL=gnutls
    - name: cmake check backend
      run: |
        grep -x 'PJ_SSL_BACKEND:INTERNAL=gnutls' build-cmake/CMakeCache.txt
        grep -ix '#define PJ_SSL_SOCK_IMP PJ_SSL_SOCK_IMP_gnutls' \
          build-cmake/pjlib/include/pj/compat/os_auto.h
    - name: cmake build
      run: cmake --build build-cmake -j $(nproc)
    - name: cmake install
      run: cmake --install build-cmake --prefix ${{ runner.temp }}/pj-install
    - name: cmake test find_package
      run: |
        cmake -B build-consumer tests/cmake \
          -DCMAKE_PREFIX_PATH=${{ runner.temp }}/pj-install \
          -DCMAKE_BUILD_TYPE=Release
        cmake --build build-consumer --verbose
        ./build-consumer/test_consumer
        ./build-consumer/test_consumer2
    - name: cmake test pkg-config
      run: |
        export PKG_CONFIG_PATH="${{ runner.temp }}/pj-install/lib/pkgconfig"
        cat "$PKG_CONFIG_PATH/libpjproject.pc"
        cc tests/cmake/test_consumer.c -o pc_consumer \
          $(pkg-config --static --cflags --libs libpjproject)
        ./pc_consumer
    - name: configure
      run: CFLAGS="-fPIC" CXXFLAGS="-fPIC" ./configure --with-gnutls=/usr/
    - name: make
      run: $MAKE_FAST
    - name: swig bindings
      run: cd pjsip-apps/src/swig && make
    - name: get SSL info
      run: pjlib/bin/pjlib-test-`make infotarget` --config --list | grep SSL
    - name: verify gnu tls is used
      run: pjlib/bin/pjlib-test-`make infotarget` --config --list | grep -E 'PJ_SSL_SOCK_IMP\s+:\s+2'
    - name: pjlib-test
      run: make pjlib-test
    - name: pjnath-test
      run: make pjnath-test
    - name: pjsip-test
      run: make pjsip-test
    - name: upload artifacts on failure
      if: ${{ failure() }}
      uses: actions/upload-artifact@v6
      with:
        name: ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ github.run_id }}
        path: artifacts

  # Mbed TLS backend, with both supported major versions. The full suites run
  # in the Default jobs; only what depends on the TLS backend runs here.
  mbedtls:
    needs: [detect-changes]
    if: github.event_name != 'pull_request' || needs.detect-changes.outputs.any_src == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 3.6.7
            sha256: a7e8bcbec0e6f761b4af24f25677626b35f762f68eef79c08677a363212d11f6
            config_py: scripts/config.py
          - version: 4.2.0
            sha256: 2bed9d713b4668f76553b097e72b8aa30bc8f112a940d7ae228d524bbde6ffea
            config_py: tf-psa-crypto/scripts/config.py
    name: Mbed TLS ${{ matrix.version }} / pjlib,pjnath,pjsua + CMake
    steps:
    - uses: actions/checkout@v5
    - name: config site
      run: echo -e "#define PJ_TODO(x)\n" > pjlib/include/pj/config_site.h
    - name: Mbed TLS prefix
      run: echo "MBEDTLS_PREFIX=$HOME/mbedtls-${{ matrix.version }}" >> $GITHUB_ENV
    - name: cache Mbed TLS
      id: cache-mbedtls
      uses: actions/cache@v5
      with:
        path: ~/mbedtls-${{ matrix.version }}
        # Bump the suffix when the build recipe below changes
        key: mbedtls-${{ matrix.version }}-${{ runner.os }}-threading-1
    - name: build Mbed TLS
      if: steps.cache-mbedtls.outputs.cache-hit != 'true'
      run: |
        cd $RUNNER_TEMP
        curl -sSfL -o mbedtls.tar.bz2 \
          https://github.com/Mbed-TLS/mbedtls/releases/download/mbedtls-${{ matrix.version }}/mbedtls-${{ matrix.version }}.tar.bz2
        echo "${{ matrix.sha256 }}  mbedtls.tar.bz2" | sha256sum -c
        tar xjf mbedtls.tar.bz2
        cd mbedtls-${{ matrix.version }}
        # PJSIP's threads share PSA Crypto, which needs the threading layer
        python3 ${{ matrix.config_py }} set MBEDTLS_THREADING_C
        python3 ${{ matrix.config_py }} set MBEDTLS_THREADING_PTHREAD
        cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
              -DENABLE_TESTING=OFF -DENABLE_PROGRAMS=OFF \
              -DCMAKE_INSTALL_PREFIX=$MBEDTLS_PREFIX
        cmake --build build -j 3
        cmake --install build
    # With GnuTLS also installed, --with-mbedtls must still select Mbed TLS
    - name: install GnuTLS
      run: sudo apt-get update && sudo apt-get install -y libgnutls28-dev
    # The same backend with CMake, before the autotools build writes its
    # headers into the source tree. Asked for by name, a backend that is not
    # found stops the configure. The consumers get only the pjproject
    # install: its package must find the backend again.
    - name: cmake configure
      run: >-
        cmake -B build-cmake -DCMAKE_BUILD_TYPE=Release
        -DPJLIB_WITH_SSL=mbedtls -DMbedTLS_ROOT=$MBEDTLS_PREFIX
    - name: cmake check backend
      run: |
        grep -x 'PJ_SSL_BACKEND:INTERNAL=mbedtls' build-cmake/CMakeCache.txt
        grep -ix '#define PJ_SSL_SOCK_IMP PJ_SSL_SOCK_IMP_mbedtls' \
          build-cmake/pjlib/include/pj/compat/os_auto.h
    - name: cmake build
      run: cmake --build build-cmake -j $(nproc)
    - name: cmake install
      run: cmake --install build-cmake --prefix ${{ runner.temp }}/pj-install
    - name: cmake test find_package
      run: |
        cmake -B build-consumer tests/cmake \
          -DCMAKE_PREFIX_PATH=${{ runner.temp }}/pj-install \
          -DCMAKE_BUILD_TYPE=Release
        cmake --build build-consumer --verbose
        ./build-consumer/test_consumer
        ./build-consumer/test_consumer2
    - name: cmake test pkg-config
      run: |
        export PKG_CONFIG_PATH="${{ runner.temp }}/pj-install/lib/pkgconfig"
        cat "$PKG_CONFIG_PATH/libpjproject.pc"
        cc tests/cmake/test_consumer.c -o pc_consumer \
          $(pkg-config --static --cflags --libs libpjproject)
        ./pc_consumer
    - name: configure
      run: ./configure --with-mbedtls=$MBEDTLS_PREFIX
    - name: make
      run: $MAKE_FAST
    - name: get SSL info
      run: pjlib/bin/pjlib-test-`make infotarget` --config --list | grep SSL
    - name: verify mbedtls is used
      run: pjlib/bin/pjlib-test-`make infotarget` --config --list | grep -E 'PJ_SSL_SOCK_IMP\s+:\s+6'
    - name: pjlib-test (ssl_sock only)
      run: cd pjlib/build && ../bin/pjlib-test-`make -s -C ../.. infotarget` $CI_MODE $CI_ARGS ssl_sock_test ssl_sock_stress_test
    - name: pjnath-test (turn_sock_test only)
      run: cd pjnath/build && ../bin/pjnath-test-`make -s -C ../.. infotarget` $CI_MODE $CI_ARGS turn_sock_test
    - name: set up Python 3.10 for pjsua test
      uses: actions/setup-python@v6
      with:
