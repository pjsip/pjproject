name: CI MacOS
on:
  push:
    branches:
      - 'master'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# Cancel superseded runs on the same ref (e.g. a force-push to a PR) so they
# stop holding the scarce concurrent macOS runner slots.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_ARGS: -w 2 --shuffle --stdout-buf 1
  CI_MODE: --ci-mode
  # Setting CI_RUNNER to empty should disable cirunner
  CI_RUNNER: python ${{ github.workspace }}/cirunner/cirunner.py -t 3600 -o ${{ github.workspace }}/artifacts --
  MAKE_FAST: make -j 2
  # Workaround for Apple clang ASan bugs on macOS ARM64 (Sequoia):
  # 1. use_sigaltstack=0: sigaltstack(SS_DISABLE) fails during thread exit:
  #      CHECK failed: sanitizer_posix_libcdep.cpp "((0)) == ((sigaltstack(...)))"
  # 2. detect_stack_use_after_return=0: PlatformUnpoisonStacks() crashes when
  #    longjmp is used in non-main threads (e.g. SIP parser error recovery via
  #    pj_throw_exception_ -> pj_longjmp). ASan intercepts longjmp at runtime
  #    and fails to determine worker thread stack bounds (addr=0x0):
  #      CHECK failed: asan_poisoning.cpp "((AddrIsInMem(...))) != (0)" (0x0, 0x0)
  # Only affects ASan-instrumented binaries; harmless for non-ASan jobs.
  ASAN_OPTIONS: use_sigaltstack=0:detect_stack_use_after_return=0
jobs:
  # Draft PRs run the build only jobs. Skipping this job skips every test job
  # that needs it.
  detect-changes:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    outputs:
      # macOS-specific code lives in pjlib (OS abstractions, ioqueue/kqueue,
      # sockets, threading, SSL) and pjmedia (audio/video devices, native
      # codecs, AEC). Other components (pjlib-util, pjnath, pjsip, pjsip-apps)
      # are platform-independent protocol logic already covered by Linux CI.
      # Only run full Mac test suite for changes to platform-specific areas.
      mac_full_tests: ${{ steps.filter.outputs.core == 'true' || steps.filter.outputs.pjmedia == 'true' || steps.filter.outputs.tests == 'true' || steps.filter.outputs.ci == 'true' }}
      cmake: ${{ steps.filter.outputs.cmake == 'true' }}
    steps:
    - uses: actions/checkout@v5
    - uses: dorny/paths-filter@v4
      if: github.event_name == 'pull_request'
      id: filter
      with:
        filters: |
          core:
            - 'pjlib/**'
            - 'build/**'
            - 'configure*'
            - 'aconfigure*'
            - 'Makefile'
            - '*.mak*'
            - 'third_party/**'
          pjlib_util:
            - 'pjlib-util/**'
          pjnath:
            - 'pjnath/**'
          pjmedia:
            - 'pjmedia/**'
          pjsip:
            - 'pjsip/**'
          pjsip_apps:
            - 'pjsip-apps/**'
          tests:
            - 'tests/**'
          ci:
            - '.github/**'
          cmake:
            - 'CMakeLists.txt'
            - '**/CMakeLists.txt'
            - 'cmake/**'
            - '**/*.cm'
            - 'libpjproject.pc.in'
            - 'tests/cmake/**'
            - '.github/**'

  default-build:
    # checking pure lib source distribution with plain configure & make
    runs-on: macos-latest
    name: Default / build only
    steps:
    - uses: actions/checkout@v5
    - name: install cirunner
      run: |
        git clone --depth 1 https://github.com/pjsip/cirunner.git
        cirunner/installmac.sh
    - name: config site
      run: echo -e "#define PJ_TODO(x)\n" > pjlib/include/pj/config_site.h
    - name: configure
      run: ./configure
    - name: make
      run: $MAKE_FAST
    - name: upload artifacts on failure
      if: ${{ failure() }}
      uses: actions/upload-artifact@v6
      with:
        name: ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ github.run_id }}
        path: artifacts

  default-pjlib-util-pjmedia-pjnath:
    # full bundle: enable all codecs + AEC + DTLS
    needs: [detect-changes]
    if: github.event_name != 'pull_request' || needs.detect-changes.outputs.mac_full_tests == 'true'
    runs-on: macos-latest
    name: Default / pjmedia,pjnath
    steps:
    - uses: actions/checkout@v5
    - name: install cirunner
      run: |
        git clone --depth 1 https://github.com/pjsip/cirunner.git
        cirunner/installmac.sh
    - name: install dependencies
      run: brew install openssl opencore-amr
    - name: config site
      run: cd pjlib/include/pj && cp config_site_test.h config_site.h
    - name: configure
      run: CFLAGS="-g $(pkg-config --cflags openssl) $(pkg-config --cflags opencore-amrnb) -fPIC" LDFLAGS="$(pkg-config --libs-only-L openssl) $(pkg-config --libs-only-L opencore-amrnb)" CXXFLAGS="-g -fPIC" ./configure --enable-libwebrtc-aec3
    - name: make
      run: $MAKE_FAST
    - name: disable firewall
      run: sudo /usr/libexec/ApplicationFirewall/socketfilterfw --setglobalstate off
    - name: pjmedia-test
      run: make pjmedia-test
    - name: pjnath-test
      run: make pjnath-test
    - name: upload artifacts on failure
      if: ${{ failure() }}
      uses: actions/upload-artifact@v6
      with:
        name: ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ github.run_id }}
        path: artifacts

  default-pjsua-test:
    needs: [detect-changes]
    if: github.event_name != 'pull_request' || needs.detect-changes.outputs.mac_full_tests == 'true'
    runs-on: macos-latest
    name: Default / pjsua-test
    steps:
    - uses: actions/checkout@v5
    - name: install cirunner
      run: |
        git clone --depth 1 https://github.com/pjsip/cirunner.git
        cirunner/installmac.sh
    - name: install dependencies
      run: brew install openssl opencore-amr vo-amrwbenc swig sipp
    - name: set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'
    - name: Install PESQ and Dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        python -m pip install numpy cython
        python -m pip install pesq scipy
    - name: Download and Unzip Visqol
      run: |
        curl -L "https://github.com/pjsip/third_party_libs/raw/main/visqol_mac.zip" -o visqol.zip
        unzip -o visqol.zip -d tests/pjsua/tools
        chmod +x tests/pjsua/tools/visqol
    - name: config site
      # Enable RTCP XR so scripts-call/415_call_rtcp_xr.py runs instead of
      # skipping (it skips unless PJMEDIA_HAS_RTCP_XR is compiled in; the
      # test then activates XR per-call via pjsua's --rtcp-xr option).
      run: |
        cd pjlib/include/pj
        cp config_site_test.h config_site.h
        echo "#define PJMEDIA_HAS_RTCP_XR 1" >> config_site.h
    - name: configure
      run: CFLAGS="-g $(pkg-config --cflags openssl) $(pkg-config --cflags opencore-amrnb) $(pkg-config --cflags opencore-amrwb) $(pkg-config --cflags vo-amrwbenc) -fPIC" LDFLAGS="$(pkg-config --libs-only-L openssl) $(pkg-config --libs-only-L opencore-amrnb) $(pkg-config --libs-only-L opencore-amrwb) $(pkg-config --libs-only-L vo-amrwbenc)" CXXFLAGS="-g -fPIC" ./configure
    - name: make
      run: $MAKE_FAST
    - name: disable firewall
      run: sudo /usr/libexec/ApplicationFirewall/socketfilterfw --setglobalstate off
    - name: swig bindings
      run: cd pjsip-apps/src/swig && make
    - name: pjsua-test
      run: make pjsua-test
    - name: upload artifacts on failure
      if: ${{ failure() }}
      uses: actions/upload-artifact@v6
      with:
        name: ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ github.run_id }}
        path: artifacts

  default-pjsip-test:
    needs: [detect-changes]
    if: github.event_name != 'pull_request' || needs.detect-changes.outputs.mac_full_tests == 'true'
    runs-on: macos-latest
    name: Default / pjlib,util,pjsip-test
    steps:
    - uses: actions/checkout@v5
    - name: install cirunner
      run: |
        git clone --depth 1 https://github.com/pjsip/cirunner.git
        cirunner/installmac.sh
    - name: install dependencies
      run: brew install openssl opencore-amr
    - name: config site
      run: cd pjlib/include/pj && cp config_site_test.h config_site.h
    - name: configure
      run: CFLAGS="-g $(pkg-config --cflags openssl) $(pkg-config --cflags opencore-amrnb)" LDFLAGS="$(pkg-config --libs-only-L openssl) $(pkg-config --libs-only-L opencore-amrnb)" ./configure
    - name: make
      run: $MAKE_FAST
    - name: disable firewall
      run: sudo /usr/libexec/ApplicationFirewall/socketfilterfw --setglobalstate off
    - name: pjlib-test
      run: make pjlib-test
    - name: pjlib-util-test
      run: make pjlib-util-test
    - name: pjsip-test
      run: make pjsip-test
    - name: upload artifacts on failure
      if: ${{ failure() }}
      uses: actions/upload-artifact@v6
      with:
        name: ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ github.run_id }}
        path: artifacts

  openssl-1:
    needs: [detect-changes]
    if: github.event_name != 'pull_request' || needs.detect-changes.outputs.mac_full_tests == 'true'
    runs-on: macos-latest
    name: OpenSSL / pjlib,util,pjnath,pjmedia
    steps:
    - uses: actions/checkout@v5
    - name: install cirunner
      run: |
        git clone --depth 1 https://github.com/pjsip/cirunner.git
        cirunner/installmac.sh
    - name: install dependencies
      run: brew install openssl swig
    - name: configure
      run: CFLAGS="$(pkg-config --cflags openssl) -fPIC" LDFLAGS="$(pkg-config --libs-only-L openssl)" CXXFLAGS="-fPIC" ./configure
    - name: config site
      run: cd pjlib/include/pj && cp config_site_test.h config_site.h
    - name: make
      run: $MAKE_FAST
    - name: set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'
    - name: swig bindings
      run: cd pjsip-apps/src/swig && make
    - name: disable firewall
      run: sudo /usr/libexec/ApplicationFirewall/socketfilterfw --setglobalstate off
    - name: get SSL info
      run: pjlib/bin/pjlib-test-`make infotarget` --config --list | grep SSL
    - name: verify openssl is used
      run: pjlib/bin/pjlib-test-`make infotarget` --config --list | grep -E 'PJ_SSL_SOCK_IMP\s+:\s+1'
    # CI de-dup: the full pjlib-test, pjlib-util-test and pjnath-test suites
    # already run once in the Default jobs. Only the SSL-backend-dependent
    # tests need to run per backend here: ssl_sock_test + ssl_sock_stress_test
    # from pjlib-test, and turn_sock_test (which covers TURN-over-TLS) from
    # pjnath-test. pjlib-util-test has no SSL dependency and is dropped.
    # Restore the commented-out steps below to run the full suites here again.
    - name: pjlib-test (ssl_sock only)
      run: cd pjlib/build && ../bin/pjlib-test-`make -s -C ../.. infotarget` $CI_MODE $CI_ARGS ssl_sock_test ssl_sock_stress_test
    # - name: pjlib-test
    #   run: make pjlib-test
    # - name: pjlib-util-test
    #   run: make pjlib-util-test
    - name: pjmedia-test
      run: make pjmedia-test
    - name: pjnath-test (turn_sock_test only)
      run: cd pjnath/build && ../bin/pjnath-test-`make -s -C ../.. infotarget` $CI_MODE $CI_ARGS turn_sock_test
    # - name: pjnath-test
    #   run: make pjnath-test
    - name: upload artifacts on failure
      if: ${{ failure() }}
      uses: actions/upload-artifact@v6
      with:
        name: ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ github.run_id }}
        path: artifacts

  openssl-2:
    needs: [detect-changes]
    if: github.event_name != 'pull_request' || needs.detect-changes.outputs.mac_full_tests == 'true'
    runs-on: macos-latest
    name: OpenSSL / pjsip
    steps:
    - uses: actions/checkout@v5
    - name: install cirunner
      run: |
        git clone --depth 1 https://github.com/pjsip/cirunner.git
        cirunner/installmac.sh
    - name: install dependencies
      run: brew install openssl
    - name: configure
      run: CFLAGS="$(pkg-config --cflags openssl) -fPIC" LDFLAGS="$(pkg-config --libs-only-L openssl)" CXXFLAGS="-fPIC" ./configure
    - name: config site
      run: cd pjlib/include/pj && cp config_site_test.h config_site.h
    - name: make
      run: $MAKE_FAST
    - name: disable firewall
      run: sudo /usr/libexec/ApplicationFirewall/socketfilterfw --setglobalstate off
    - name: get SSL info
      run: pjlib/bin/pjlib-test-`make infotarget` --config --list | grep SSL
    - name: verify openssl is used
      run: pjlib/bin/pjlib-test-`make infotarget` --config --list | grep -E 'PJ_SSL_SOCK_IMP\s+:\s+1'
    - name: pjsip-test
      run: make pjsip-test
    - name: upload artifacts on failure
      if: ${{ failure() }}
      uses: actions/upload-artifact@v6
      with:
        name: ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ github.run_id }}
        path: artifacts

  gnu-tls-1:
    needs: [detect-changes]
    if: github.event_name != 'pull_request' || needs.detect-changes.outputs.mac_full_tests == 'true'
    runs-on: macos-latest
    name: GnuTLS / pjlib,util,pjmedia,pjnath
    steps:
    - uses: actions/checkout@v5
    - name: install cirunner
      run: |
        git clone --depth 1 https://github.com/pjsip/cirunner.git
        cirunner/installmac.sh
    - name: install dependencies
      run: brew install gnutls swig
    - name: config site
      run: cd pjlib/include/pj && cp config_site_test.h config_site.h
    - name: configure
      run: CFLAGS="-fPIC" CXXFLAGS="-fPIC" ./configure --with-gnutls=`brew --prefix gnutls`
    - name: make
      run: $MAKE_FAST
    - name: set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'
    - name: swig bindings
      run: cd pjsip-apps/src/swig && make
    - name: get SSL info
      run: pjlib/bin/pjlib-test-`make infotarget` --config --list | grep SSL
    - name: verify gnu tls is used
      run: pjlib/bin/pjlib-test-`make infotarget` --config --list | grep -E 'PJ_SSL_SOCK_IMP\s+:\s+2'
    # CI de-dup: the full pjlib-test, pjlib-util-test and pjnath-test suites
    # already run once in the Default jobs. Only the SSL-backend-dependent
    # tests need to run per backend here: ssl_sock_test + ssl_sock_stress_test
    # from pjlib-test, and turn_sock_test (which covers TURN-over-TLS) from
    # pjnath-test. pjlib-util-test has no SSL dependency and is dropped.
    # Restore the commented-out steps below to run the full suites here again.
    - name: pjlib-test (ssl_sock only)
      run: cd pjlib/build && ../bin/pjlib-test-`make -s -C ../.. infotarget` $CI_MODE $CI_ARGS ssl_sock_test ssl_sock_stress_test
    # - name: pjlib-test
    #   run: make pjlib-test
    # - name: pjlib-util-test
    #   run: make pjlib-util-test
    - name: pjmedia-test
      run: make pjmedia-test
    - name: pjnath-test (turn_sock_test only)
      run: cd pjnath/build && ../bin/pjnath-test-`make -s -C ../.. infotarget` $CI_MODE $CI_ARGS turn_sock_test
    # - name: pjnath-test
    #   run: make pjnath-test
    - name: upload artifacts on failure
      if: ${{ failure() }}
      uses: actions/upload-artifact@v6
      with:
        name: ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ github.run_id }}
        path: artifacts

  gnu-tls-2:
    needs: [detect-changes]
    if: github.event_name != 'pull_request' || needs.detect-changes.outputs.mac_full_tests == 'true'
    runs-on: macos-latest
    name: GnuTLS / pjsip-test
    steps:
    - uses: actions/checkout@v5
    - name: install cirunner
      run: |
        git clone --depth 1 https://github.com/pjsip/cirunner.git
        cirunner/installmac.sh
    - name: install dependencies
      run: brew install gnutls swig
    - name: config site
      run: cd pjlib/include/pj && cp config_site_test.h config_site.h
    - name: configure
      run: CFLAGS="-fPIC" CXXFLAGS="-fPIC" ./configure --with-gnutls=`brew --prefix gnutls`
    - name: make
      run: $MAKE_FAST
    - name: get SSL info
      run: pjlib/bin/pjlib-test-`make infotarget` --config --list | grep SSL
    - name: verify gnu tls is used
      run: pjlib/bin/pjlib-test-`make infotarget` --config --list | grep -E 'PJ_SSL_SOCK_IMP\s+:\s+2'
    - name: pjsip-test
      run: make pjsip-test
    - name: upload artifacts on failure
      if: ${{ failure() }}
      uses: actions/upload-artifact@v6
      with:
        name: ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ github.run_id }}
        path: artifacts

  video-openh264-1:
    needs: [detect-changes]
    if: github.event_name != 'pull_request' || needs.detect-changes.outputs.mac_full_tests == 'true'
    runs-on: macos-latest
    name: Openh264+VPX / pjsua
    steps:
    - uses: actions/checkout@v5
    - name: install cirunner
      run: |
        git clone --depth 1 https://github.com/pjsip/cirunner.git
        cirunner/installmac.sh
    - name: install dependencies
      run: brew install openssl openh264 libvpx opencore-amr vo-amrwbenc swig sipp
    - name: config site
      run: cd pjlib/include/pj && cp config_site_test.h config_site.h && echo -e "#define PJMEDIA_HAS_VIDEO 1\n#define PJMEDIA_CONF_BACKEND PJMEDIA_CONF_SERIAL_BRIDGE_BACKEND" >> config_site.h
    - name: configure
      run: CFLAGS="-g $(pkg-config --cflags openssl) $(pkg-config --cflags opencore-amrnb) $(pkg-config --cflags opencore-amrwb) $(pkg-config --cflags vo-amrwbenc) -DHAS_VID_CODEC_TEST=0 -fPIC -fsanitize=address" LDFLAGS="$(pkg-config --libs-only-L openssl) $(pkg-config --libs-only-L opencore-amrnb) $(pkg-config --libs-only-L opencore-amrwb) $(pkg-config --libs-only-L vo-amrwbenc) -fsanitize=address" CXXFLAGS="-g -fPIC -fsanitize=address" ./configure
    - name: make
      run: $MAKE_FAST
    # conf_test on the serial conference bridge: the backend cannot be
    # selected at runtime, and this is the only job that builds it and runs
    # pjmedia tests.
    - name: pjmedia-test conf_test
      run: cd pjmedia/build && $CI_RUNNER ../bin/pjmedia-test-`make -s -C ../.. infotarget` $CI_MODE $CI_ARGS conf_test
    - name: set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'
    - name: Install PESQ and Dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        python -m pip install numpy cython
        python -m pip install pesq scipy
    - name: Download and Unzip Visqol
      run: |
        curl -L "https://github.com/pjsip/third_party_libs/raw/main/visqol_mac.zip" -o visqol.zip
        unzip -o visqol.zip -d tests/pjsua/tools
        chmod +x tests/pjsua/tools/visqol
    - name: swig bindings
      run: cd pjsip-apps/src/swig && make
    - name: disable firewall
      run: sudo /usr/libexec/ApplicationFirewall/socketfilterfw --setglobalstate off
    - name: pjsua-test
      run: make pjsua-test
    - name: upload artifacts on failure
      if: ${{ failure() }}
      uses: actions/upload-artifact@v6
      with:
        name: ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ github.run_id }}
        path: artifacts

