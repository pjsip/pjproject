    - name: upload artifacts on failure
      if: ${{ failure() }}
      uses: actions/upload-artifact@v6
      with:
        name: ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ github.run_id }}
        path: artifacts

  cmake-build:
    runs-on: windows-2022
    name: CMake / ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            options: ''
            expect: ''
            tests: sock_test udp_ioqueue_test
          - name: IOCP, schannel, WASAPI, DShow, AKA
            options: >-
              -DPJLIB_WITH_IOQUEUE=iocp -DPJLIB_WITH_SSL=schannel
              -DPJMEDIA_WITH_AUDIODEV_WASAPI=ON
              -DPJMEDIA_WITH_VIDEODEV_DSHOW=ON
              -DPJSIP_WITH_DIGEST_AKA_AUTH=ON
            expect: >-
              PJLIB_WITH_IOQUEUE=iocp PJLIB_WITH_SSL=schannel
              PJMEDIA_WITH_AUDIODEV_WASAPI=ON
              PJMEDIA_WITH_VIDEODEV_DSHOW=ON
              PJSIP_WITH_DIGEST_AKA_AUTH=ON
            tests: sock_test udp_ioqueue_test iocp_unregister_test ssl_sock_test
    env:
      # Strawberry Perl and MSYS2 ship mingw builds of OpenSSL and other
      # packages, which must not be picked up by an MSVC build.
      PJ_IGNORE_PREFIX: C:/Strawberry/c;C:/msys64/mingw64;C:/msys64/usr
    steps:
    - uses: actions/checkout@v5
    - name: configure
      run: >-
        cmake -B build -G "Visual Studio 17 2022" -A x64
        "-DCMAKE_IGNORE_PREFIX_PATH=$env:PJ_IGNORE_PREFIX"
        ${{ matrix.options }}
    - name: check options
      # A backend whose dependency is not found is switched off and the build
      # then passes without it, so assert the requested ones survived.
      if: matrix.expect != ''
      run: |
        $cache = cmake -LA -N build
        $failed = $false
        foreach ($e in "${{ matrix.expect }}".Split(' ', [StringSplitOptions]::RemoveEmptyEntries)) {
          $name, $want = $e.Split('=')
          $m = $cache | Select-String "^${name}:[^=]*=(.*)$"
          $got = if ($m) { $m.Matches[0].Groups[1].Value } else { '' }
          if ($got -ne $want) {
            Write-Host "::error::$name is '$got', expected '$want'"
            $failed = $true
          } else {
            Write-Host "$name=$got"
          }
        }
        if ($failed) { exit 1 }
    - name: OpenSSL runtime
      # The runner's OpenSSL is used whenever found (by pjlib, or by srtp for
      # AES-GCM), and its DLLs are needed to run anything linked to it.
      run: |
        $m = cmake -LA -N build | Select-String '^OPENSSL_INCLUDE_DIR:PATH=(.+)$'
        if ($m) {
          $bin = Join-Path (Split-Path $m.Matches[0].Groups[1].Value) bin
          if (Test-Path $bin) {
            Write-Host "OpenSSL: $bin"
            Add-Content $env:GITHUB_PATH $bin
          }
        }
    - name: build Debug
      run: cmake --build build --config Debug --parallel
    - name: build Release
      run: cmake --build build --config Release --parallel
    - name: pjlib-test
      # Run from pjlib/bin, as the SSL tests load certificates from ../build/
      run: |
        $PSNativeCommandUseErrorActionPreference = $true
        New-Item -ItemType Directory -Force pjlib/bin | Out-Null
        cd pjlib/bin
        ../../build/pjlib/bin/pjlib-test-Release.exe --ci-mode ${{ matrix.tests }}
    - name: install
      run: cmake --install build --config Release --prefix "${{ runner.temp }}/pj-install"
    - name: check install layout
      run: |
        $p = "${{ runner.temp }}/pj-install"
        foreach ($f in "lib/libpj-Release.lib", "lib/pkgconfig/libpjproject.pc") {
          if (-not (Test-Path "$p/$f")) { Write-Host "::error::$f missing"; exit 1 }
        }
        if (Test-Path "$p/bin/libpj-Release.lib") { Write-Host "::error::library in bin/"; exit 1 }
    - name: test find_package
      run: |
        $PSNativeCommandUseErrorActionPreference = $true
        cmake -B build-consumer tests/cmake -G "Visual Studio 17 2022" -A x64 `
          "-DCMAKE_PREFIX_PATH=${{ runner.temp }}/pj-install" `
          "-DCMAKE_IGNORE_PREFIX_PATH=$env:PJ_IGNORE_PREFIX"
        cmake --build build-consumer --config Release
        ./build-consumer/Release/test_consumer.exe
        ./build-consumer/Release/test_consumer2.exe

  # One optional audio codec (Opus) and one video codec (libvpx), from
  # vcpkg, found through <Pkg>_ROOT. A library that is not found is dropped
  # without failing the configure, so assert both were used. The consumers
  # get only the pjproject install: its package must find both where the
  # build did. vcpkg's vpx.lib is built with /GL, which makes every Release
  # program linking pjmedia relink with /LTCG, so this is not part of the
  # ungated cmake-build.
  cmake-opus-vpx:
    needs: [detect-changes]
    if: github.event_name != 'pull_request' || needs.detect-changes.outputs.cmake == 'true'
    runs-on: windows-2022
    name: CMake / Opus + VPX from <Pkg>_ROOT
    env:
      # as in cmake-build
      PJ_IGNORE_PREFIX: C:/Strawberry/c;C:/msys64/mingw64;C:/msys64/usr
    steps:
    - uses: actions/checkout@v5
    - name: vcpkg paths
      id: vcpkg
      run: |
        $prefix = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows" -replace '\\', '/'
        $cache = "${{ runner.temp }}/vcpkg-cache" -replace '\\', '/'
        New-Item -ItemType Directory -Force $cache | Out-Null
        Add-Content $env:GITHUB_ENV "VCPKG_PREFIX=$prefix"
        Add-Content $env:GITHUB_ENV "VCPKG_DEFAULT_BINARY_CACHE=$cache"
        Add-Content $env:GITHUB_OUTPUT "image=$env:ImageVersion"
    - name: cache vcpkg packages
      # vcpkg's binary cache: packages are named by an ABI hash, so a stale
      # entry is only a miss. The runner image updates vcpkg's ports.
      uses: actions/cache@v5
      with:
        path: ${{ runner.temp }}/vcpkg-cache
        key: vcpkg-x64-windows-opus-libvpx-${{ steps.vcpkg.outputs.image }}
        restore-keys: vcpkg-x64-windows-opus-libvpx-
    - name: install dependencies
      run: |
        $PSNativeCommandUseErrorActionPreference = $true
        & "$env:VCPKG_INSTALLATION_ROOT/vcpkg" install opus libvpx --triplet x64-windows
    - name: configure
      run: >-
        cmake -B build -G "Visual Studio 17 2022" -A x64
        "-DCMAKE_IGNORE_PREFIX_PATH=$env:PJ_IGNORE_PREFIX"
        "-DOPUS_ROOT=$env:VCPKG_PREFIX" "-DVPX_ROOT=$env:VCPKG_PREFIX"
    - name: check the roots
      # both codecs on, the library and the headers from vcpkg
      run: |
        $cache = Get-Content build/CMakeCache.txt
        foreach ($p in 'OPUS', 'VPX') {
          if (-not ($cache -ccontains "PJMEDIA_WITH_${p}_CODEC:BOOL=ON")) {
            Write-Host "::error::PJMEDIA_WITH_${p}_CODEC is not ON"
            exit 1
          }
          foreach ($v in 'LIBRARY', 'INCLUDE_DIR') {
            $line = $cache -match "^${p}_${v}:"
            Write-Host $line
            if (-not ($line -like "*=$env:VCPKG_PREFIX/*")) {
              Write-Host "::error::${p}_$v is not from $env:VCPKG_PREFIX"
              exit 1
            }
          }
        }
    - name: OpenSSL runtime
      # as in cmake-build
      run: |
        $m = cmake -LA -N build | Select-String '^OPENSSL_INCLUDE_DIR:PATH=(.+)$'
        if ($m) {
          $bin = Join-Path (Split-Path $m.Matches[0].Groups[1].Value) bin
          if (Test-Path $bin) {
            Write-Host "OpenSSL: $bin"
            Add-Content $env:GITHUB_PATH $bin
          }
        }
    - name: build
      run: cmake --build build --config Release --parallel
    - name: install
      run: cmake --install build --config Release --prefix "${{ runner.temp }}/pj-install"
    - name: test find_package
      run: |
        $PSNativeCommandUseErrorActionPreference = $true
        cmake -B build-consumer tests/cmake -G "Visual Studio 17 2022" -A x64 `
          "-DCMAKE_PREFIX_PATH=${{ runner.temp }}/pj-install" `
          "-DCMAKE_IGNORE_PREFIX_PATH=$env:PJ_IGNORE_PREFIX"
        cmake --build build-consumer --config Release
        $env:PATH = "$env:VCPKG_PREFIX/bin;$env:PATH"
        ./build-consumer/Release/test_consumer.exe
        ./build-consumer/Release/test_consumer2.exe

  # MinGW-w64 GCC with the UCRT runtime, from MSYS2, and MSYS2's OpenSSL.
  # No other job builds with MinGW.
  cmake-mingw:
    needs: [detect-changes]
    if: github.event_name != 'pull_request' || needs.detect-changes.outputs.cmake == 'true'
    runs-on: windows-2022
    name: CMake / MinGW UCRT64
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - uses: actions/checkout@v5
    - uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        release: false
        install: >-
          mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake
          mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-pkgconf
          mingw-w64-ucrt-x86_64-openssl
    - name: config site
      run: echo -e "#define PJ_TODO(x)\n" > pjlib/include/pj/config_site.h
    - name: configure
      run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
    - name: build
      run: cmake --build build
    - name: pjlib-test
      # as in cmake-build; the SSL test certificates are found from pjlib/build
      run: |
        cd pjlib/build
        ../../build/pjlib/bin/pjlib-test --ci-mode sock_test udp_ioqueue_test ssl_sock_test
    - name: install
      run: cmake --install build --prefix "$(cygpath -m '${{ runner.temp }}')/pj-install"
    - name: test find_package
      run: |
        prefix="$(cygpath -m '${{ runner.temp }}')/pj-install"
        cmake -B build-consumer tests/cmake -G Ninja \
          -DCMAKE_PREFIX_PATH="$prefix" -DCMAKE_BUILD_TYPE=Release
        cmake --build build-consumer --verbose
        ./build-consumer/test_consumer
        ./build-consumer/test_consumer2
    - name: test pkg-config
      run: |
        export PKG_CONFIG_PATH="$(cygpath -m '${{ runner.temp }}')/pj-install/lib/pkgconfig"
        cat "$PKG_CONFIG_PATH/libpjproject.pc"
        gcc tests/cmake/test_consumer.c -o pc_consumer \
          $(pkg-config --static --cflags --libs libpjproject)
        ./pc_consumer

  # A 32-bit (Win32) build, for CMake's 32-bit x86 branches that no other
  # job takes: the architecture detected as i386, WebRTC's SSE2 sources
  # built with /arch:SSE2, and os_auto.h without PJ_WIN64 and with 4-byte
  # pool alignment. The MSVC project jobs build Win32 without CMake and run
  # its tests.
  cmake-win32:
    needs: [detect-changes]
    if: github.event_name != 'pull_request' || needs.detect-changes.outputs.cmake == 'true'
    runs-on: windows-2022
    name: CMake / Win32
    env:
      # as in cmake-build
      PJ_IGNORE_PREFIX: C:/Strawberry/c;C:/msys64/mingw64;C:/msys64/usr
    steps:
    - uses: actions/checkout@v5
    - name: configure
      run: >-
        cmake -B build -G "Visual Studio 17 2022" -A Win32
        "-DCMAKE_IGNORE_PREFIX_PATH=$env:PJ_IGNORE_PREFIX"
    - name: check 32-bit configuration
      run: |
        $failed = $false
        $cache = Get-Content build/CMakeCache.txt
        foreach ($e in '_pj_detected_arch:INTERNAL=i386',
                       '_pj_detected_simd_ext_flags:INTERNAL=/arch:SSE2',
                       'PJMEDIA_WITH_WEBRTC_AEC:BOOL=ON') {
          $name = $e.Split(':')[0]
          if ($cache -ccontains $e) { Write-Host $e; continue }
          Write-Host "::error::expected $e, got: $($cache -match "^${name}:")"
          $failed = $true
        }
        $h = Get-Content build/pjlib/include/pj/compat/os_auto.h
        foreach ($e in '/* #undef PJ_WIN64 */', '#define PJ_POOL_ALIGNMENT 4') {
          if ($h -ccontains $e) { Write-Host $e; continue }
          Write-Host "::error::os_auto.h has no '$e'"
          $failed = $true
        }
        if ($failed) { exit 1 }
    - name: build
      run: cmake --build build --config Release --parallel
    - name: install
      run: cmake --install build --config Release --prefix "${{ runner.temp }}/pj-install"
    - name: test find_package
      run: |
        $PSNativeCommandUseErrorActionPreference = $true
        cmake -B build-consumer tests/cmake -G "Visual Studio 17 2022" -A Win32 `
          "-DCMAKE_PREFIX_PATH=${{ runner.temp }}/pj-install" `
          "-DCMAKE_IGNORE_PREFIX_PATH=$env:PJ_IGNORE_PREFIX"
        cmake --build build-consumer --config Release
        ./build-consumer/Release/test_consumer.exe
        ./build-consumer/Release/test_consumer2.exe
