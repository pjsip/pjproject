name: CI Windows
on:
  push:
    branches:
      - 'master'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# Cancel superseded runs on the same ref (e.g. a force-push to a PR) so they
# stop holding CI runner slots.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_WIN_ARGS: -w 3 --shuffle
  CI_MODE: --ci-mode
  # Setting CI_RUNNER to empty should disable cirunner
  CI_RUNNER: python ${{ github.workspace }}/cirunner/cirunner.py -t 3600 -o ${{ github.workspace }}/artifacts --
jobs:
  # Draft PRs run the build only jobs. Skipping this job skips every test job
  # that needs it.
  detect-changes:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    outputs:
      # Aggregate dependency groups — each combines the raw path filters
      # relevant to a set of test jobs, so per-job conditions are one-liners.
      pjlib_deps: ${{ steps.filter.outputs.core == 'true' || steps.filter.outputs.tests == 'true' || steps.filter.outputs.ci == 'true' }}
      pjnath_deps: ${{ steps.filter.outputs.core == 'true' || steps.filter.outputs.pjlib_util == 'true' || steps.filter.outputs.pjnath == 'true' || steps.filter.outputs.tests == 'true' || steps.filter.outputs.ci == 'true' }}
      pjmedia_deps: ${{ steps.filter.outputs.core == 'true' || steps.filter.outputs.pjlib_util == 'true' || steps.filter.outputs.pjmedia == 'true' || steps.filter.outputs.tests == 'true' || steps.filter.outputs.ci == 'true' }}
      pjsip_deps: ${{ steps.filter.outputs.core == 'true' || steps.filter.outputs.pjlib_util == 'true' || steps.filter.outputs.pjsip == 'true' || steps.filter.outputs.tests == 'true' || steps.filter.outputs.ci == 'true' }}
      pjmedia_pjsip_deps: ${{ steps.filter.outputs.core == 'true' || steps.filter.outputs.pjlib_util == 'true' || steps.filter.outputs.pjmedia == 'true' || steps.filter.outputs.pjsip == 'true' || steps.filter.outputs.tests == 'true' || steps.filter.outputs.ci == 'true' }}
      pjnath_pjmedia_deps: ${{ steps.filter.outputs.core == 'true' || steps.filter.outputs.pjlib_util == 'true' || steps.filter.outputs.pjnath == 'true' || steps.filter.outputs.pjmedia == 'true' || steps.filter.outputs.tests == 'true' || steps.filter.outputs.ci == 'true' }}
      pjnath_pjsip_deps: ${{ steps.filter.outputs.core == 'true' || steps.filter.outputs.pjlib_util == 'true' || steps.filter.outputs.pjnath == 'true' || steps.filter.outputs.pjsip == 'true' || steps.filter.outputs.tests == 'true' || steps.filter.outputs.ci == 'true' }}
      any_src: ${{ steps.filter.outputs.core == 'true' || steps.filter.outputs.pjlib_util == 'true' || steps.filter.outputs.pjnath == 'true' || steps.filter.outputs.pjmedia == 'true' || steps.filter.outputs.pjsip == 'true' || steps.filter.outputs.pjsip_apps == 'true' || steps.filter.outputs.tests == 'true' || steps.filter.outputs.ci == 'true' }}
      cmake: ${{ steps.filter.outputs.cmake == 'true' }}
    steps:
    - uses: actions/checkout@v5
    - uses: dorny/paths-filter@v4
      if: github.event_name == 'pull_request'
      id: filter
      with:
        filters: |
          core:
            - 'pjlib/**'
            - 'build/**'
            - 'configure*'
            - 'aconfigure*'
            - 'Makefile'
            - '*.mak*'
            - 'third_party/**'
          pjlib_util:
            - 'pjlib-util/**'
          pjnath:
            - 'pjnath/**'
          pjmedia:
            - 'pjmedia/**'
          pjsip:
            - 'pjsip/**'
          pjsip_apps:
            - 'pjsip-apps/**'
          tests:
            - 'tests/**'
          ci:
            - '.github/**'
          cmake:
            - 'CMakeLists.txt'
            - '**/CMakeLists.txt'
            - 'cmake/**'
            - '**/*.cm'
            - 'libpjproject.pc.in'
            - 'tests/cmake/**'
            - '.github/**'

  default:
    runs-on: windows-2022
    name: Default / build only
    steps:
    - uses: actions/checkout@master
    - name: Install Windows Debugging Tools
      run: |
        choco install windows-sdk-10-version-2004-windbg --yes --no-progress
      shell: powershell
    - name: install cirunner
      run: |
        git clone --depth 1 https://github.com/pjsip/cirunner.git
        cirunner/installwindows.ps1
    - name: get swig
      run: Invoke-WebRequest -Uri "https://github.com/pjsip/third_party_libs/raw/main/swigwin-4.1.1.zip"  -OutFile ".\swigwin.zip"
      shell: powershell
    - name: expand swig
      run: |
        Expand-Archive -LiteralPath .\swigwin.zip -DestinationPath .\swigwin\; pwd
        cd swigwin\swigwin-4.1.1
        Add-Content ..\..\swig_path.txt $pwd.Path
      shell: powershell
    - name: config site
      run: |
        echo #define PJ_TODO(x) > pjlib\include\pj\config_site.h
      shell: cmd
    - name: MSBuild
      run: |
        for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do call "%%i\Common7\Tools\VsDevCmd.bat"
        msbuild pjproject-vs14.sln /p:PlatformToolset=v143 /p:Configuration=Debug /p:Platform=win32
      shell: cmd
    - name: build swig
      run: |
        set /P SWIG_PATH=<swig_path.txt
        set PATH=%PATH%;%SWIG_PATH%
        dir pjlib/include/pj/config_site.h
        type pjlib/include/pj/config_site.h
        for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do call "%%i\Common7\Tools\VsDevCmd.bat"
        set INCLUDE=%INCLUDE%;%JAVA_HOME%\include;%JAVA_HOME%\include\win32
        cd pjsip-apps/build
        msbuild swig_java_pjsua2.vcxproj /p:PlatformToolset=v143 /p:Configuration=Debug-Dynamic /p:Platform=win32 /p:UseEnv=true
      shell: cmd
    - name: upload artifacts on failure
      if: ${{ failure() }}
      uses: actions/upload-artifact@v6
      with:
        name: ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ github.run_id }}
        path: artifacts

  openssl-1:
    needs: [detect-changes]
    if: github.event_name != 'pull_request' || needs.detect-changes.outputs.pjmedia_deps == 'true'
    runs-on: windows-2022
    name: OpenSSL / pjlib,util,pjmedia
    steps:
    - uses: actions/checkout@master
    - name: Install Windows Debugging Tools
      run: |
        choco install windows-sdk-10-version-2004-windbg --yes --no-progress
      shell: powershell
    - name: install cirunner
      run: |
        git clone --depth 1 https://github.com/pjsip/cirunner.git
        cirunner/installwindows.ps1
    - name: get openssl
      run: Invoke-WebRequest -Uri "https://github.com/pjsip/third_party_libs/raw/main/openssl-1.1.1s-win.zip" -OutFile ".\openssl.zip"
      shell: powershell
    - name: expand openssl
      run: |
        Expand-Archive -LiteralPath .\openssl.zip -DestinationPath .;
        cd openssl_build
        Add-Content ..\openssl_dir.txt $pwd.Path
      shell: powershell
    - name: check openssl folder
      run: |
        set /P OPENSSL_DIR=<openssl_dir.txt
        dir %OPENSSL_DIR%\include
        dir %OPENSSL_DIR%\lib
      shell: cmd
    - name: config site
      run:
        cd pjlib/include/pj; cp config_site_test.h config_site.h; Add-Content config_site.h "#define PJ_HAS_SSL_SOCK 1"
      shell: powershell
    - name: check VsDevCmd.bat
      run: |
        for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do dir "%%i\Common7\Tools\VsDevCmd.bat"
      shell: cmd
    - name: MSBuild
      working-directory: .
      run: |
        set /P OPENSSL_DIR=<openssl_dir.txt
        for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do call "%%i\Common7\Tools\VsDevCmd.bat"
        set INCLUDE=%INCLUDE%;%OPENSSL_DIR%\include
        set LIB=%LIB%;%OPENSSL_DIR%\lib
        msbuild pjproject-vs14.sln /p:PlatformToolset=v143 /p:Configuration=Release /p:Platform=win32 /p:UseEnv=true
      shell: cmd
    - name: pjlib-test
      run: |
        $env:OPENSSL_DIR = Get-Content .\openssl_dir.txt
        $env:PATH+=";$env:OPENSSL_DIR\bin"
        cd pjlib/bin
        Invoke-Expression "$env:CI_RUNNER ./pjlib-test-i386-Win32-vc14-Release.exe $env:CI_WIN_ARGS $env:CI_MODE"
      shell: powershell
    - name: pjlib-util-test
      run: |
        $env:OPENSSL_DIR = Get-Content .\openssl_dir.txt
        $env:PATH+=";$env:OPENSSL_DIR\bin"
        cd pjlib-util/bin
        Invoke-Expression "$env:CI_RUNNER ./pjlib-util-test-i386-Win32-vc14-Release.exe $env:CI_WIN_ARGS"
      shell: powershell
    - name: pjmedia-test
      run: |
        $env:OPENSSL_DIR = Get-Content .\openssl_dir.txt
        $env:PATH+=";$env:OPENSSL_DIR\bin"
        cd pjmedia/bin
        Invoke-Expression "$env:CI_RUNNER ./pjmedia-test-i386-Win32-vc14-Release.exe $env:CI_WIN_ARGS"
      shell: powershell
    - name: upload artifacts on failure
      if: ${{ failure() }}
      uses: actions/upload-artifact@v6
      with:
        name: ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ github.run_id }}
        path: artifacts

  openssl-2:
    needs: [detect-changes]
    if: github.event_name != 'pull_request' || needs.detect-changes.outputs.any_src == 'true'
    runs-on: windows-2022
    name: OpenSSL / pjsip,pjsua
    env:
      PYTHONUTF8: 1  # This forces Python to use UTF-8
    steps:
    - uses: actions/checkout@master
    - name: Install Windows Debugging Tools
      run: |
        choco install windows-sdk-10-version-2004-windbg --yes --no-progress
      shell: powershell
    - name: install cirunner
      run: |
        git clone --depth 1 https://github.com/pjsip/cirunner.git
        cirunner/installwindows.ps1
    - name: get openssl
      run: Invoke-WebRequest -Uri "https://github.com/pjsip/third_party_libs/raw/main/openssl-1.1.1s-win.zip" -OutFile ".\openssl.zip"
      shell: powershell
    - name: expand openssl
      run: |
        Expand-Archive -LiteralPath .\openssl.zip -DestinationPath .; pwd
        cd openssl_build
        Add-Content ..\openssl_dir.txt $pwd.Path
      shell: powershell
    - name: check openssl folder
      run: |
        set /P OPENSSL_DIR=<openssl_dir.txt
        dir "%OPENSSL_DIR%\include"
        dir "%OPENSSL_DIR%\lib"
      shell: cmd
    - name: install SIPp
      run: |
        Invoke-WebRequest -Uri "https://github.com/pjsip/third_party_libs/raw/main/sipp-3.2-win.zip" -OutFile ".\sipp.zip"
        Expand-Archive -LiteralPath .\sipp.zip -DestinationPath .
        cd sipp
        Add-Content ..\sipp_dir.txt $pwd.Path
        cd ..
      shell: powershell
    - name: config site
      run:
        cd pjlib/include/pj; cp config_site_test.h config_site.h; Add-Content config_site.h "#define PJ_HAS_SSL_SOCK 1"
      shell: powershell
    - name: check VsDevCmd.bat
      run: |
        for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do dir "%%i\Common7\Tools\VsDevCmd.bat"
      shell: cmd
    - name: MSBuild
      working-directory: .
      run: |
        set /P OPENSSL_DIR=<openssl_dir.txt
        for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do call "%%i\Common7\Tools\VsDevCmd.bat"
        set INCLUDE=%INCLUDE%;%OPENSSL_DIR%\include
        set LIB=%LIB%;%OPENSSL_DIR%\lib
        msbuild pjproject-vs14.sln /p:PlatformToolset=v143 /p:Configuration=Release /p:Platform=win32 /p:UseEnv=true
      shell: cmd
    - name: build test tools cmp_wav
      run: |
        set /P OPENSSL_DIR=<openssl_dir.txt
        cd tests/pjsua/tools
        set INCLUDE=%INCLUDE%;%OPENSSL_DIR%\include
        set LIB=%LIB%;%OPENSSL_DIR%\lib
        for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do call "%%i\Common7\Tools\VsDevCmd.bat"
        msbuild cmp_wav.vcxproj /p:PlatformToolset=v143 /p:Configuration=Release /p:Platform=win32 /p:UseEnv=true
      shell: cmd
    - name: get test tool visqol
      run: |
        Invoke-WebRequest -Uri "https://github.com/pjsip/third_party_libs/raw/main/visqol_win.zip" -OutFile ".\visqol_win.zip"
        Expand-Archive -LiteralPath .\visqol_win.zip -DestinationPath tests\pjsua\tools
      shell: powershell
    - name: set up Python 3.10 for pjsua test
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'
    - name: Install PESQ and Dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        python -m pip install numpy cython
        python -m pip install pesq scipy
      shell: cmd
    - name: pjsip-test
      run: |
        $env:OPENSSL_DIR = Get-Content .\openssl_dir.txt
        $env:PATH+=";$env:OPENSSL_DIR\bin"
        cd pjsip/bin
        Invoke-Expression "$env:CI_RUNNER ./pjsip-test-i386-Win32-vc14-Release.exe $env:CI_MODE $env:CI_WIN_ARGS"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        Invoke-Expression "$env:CI_RUNNER ./pjsua2-test-i386-Win32-vc14-Release.exe"
      shell: powershell
    - name: python pjsua tests
      run: |
        $env:OPENSSL_DIR = Get-Content .\openssl_dir.txt
        $env:SIPP_DIR = Get-Content .\sipp_dir.txt
        $env:PATH+=";$env:OPENSSL_DIR\bin"
        $env:PATH+=";$env:SIPP_DIR"
        cd tests/pjsua
        echo python runall.py
      shell: powershell
    - name: upload artifacts on failure
      if: ${{ failure() }}
      uses: actions/upload-artifact@v6
      with:
        name: ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ github.run_id }}
        path: artifacts

  openssl-3:
    needs: [detect-changes]
    if: github.event_name != 'pull_request' || needs.detect-changes.outputs.pjnath_deps == 'true'
    runs-on: windows-2022
    name: OpenSSL / pjnath
    steps:
    - uses: actions/checkout@master
    - name: Install Windows Debugging Tools
      run: |
        choco install windows-sdk-10-version-2004-windbg --yes --no-progress
      shell: powershell
    - name: install cirunner
      run: |
        git clone --depth 1 https://github.com/pjsip/cirunner.git
        cirunner/installwindows.ps1
    - name: get openssl
      run: Invoke-WebRequest -Uri "https://github.com/pjsip/third_party_libs/raw/main/openssl-1.1.1s-win.zip" -OutFile ".\openssl.zip"
      shell: powershell
    - name: expand openssl
      run: |
        Expand-Archive -LiteralPath .\openssl.zip -DestinationPath .;
        cd openssl_build
        Add-Content ..\openssl_dir.txt $pwd.Path
      shell: powershell
    - name: check openssl folder
      run: |
        set /P OPENSSL_DIR=<openssl_dir.txt
        dir %OPENSSL_DIR%\include
        dir %OPENSSL_DIR%\lib
      shell: cmd
    - name: config site
      run:
        cd pjlib/include/pj; cp config_site_test.h config_site.h; Add-Content config_site.h "#define PJ_HAS_SSL_SOCK 1"
      shell: powershell
    - name: check VsDevCmd.bat
      run: |
        for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do dir "%%i\Common7\Tools\VsDevCmd.bat"
      shell: cmd
    - name: MSBuild
      working-directory: .
      run: |
        set /P OPENSSL_DIR=<openssl_dir.txt
        for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do call "%%i\Common7\Tools\VsDevCmd.bat"
        set INCLUDE=%INCLUDE%;%OPENSSL_DIR%\include
        set LIB=%LIB%;%OPENSSL_DIR%\lib
        msbuild pjproject-vs14.sln /p:PlatformToolset=v143 /p:Configuration=Release /p:Platform=win32 /p:UseEnv=true
      shell: cmd
    - name: pjnath-test
      run: |
        $env:OPENSSL_DIR = Get-Content .\openssl_dir.txt
        $env:PATH+=";$env:OPENSSL_DIR\bin"
        cd pjnath/bin
        Invoke-Expression "$env:CI_RUNNER ./pjnath-test-i386-Win32-vc14-Release.exe $env:CI_WIN_ARGS"
      shell: powershell
    - name: upload artifacts on failure
      if: ${{ failure() }}
      uses: actions/upload-artifact@v6
      with:
        name: ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ github.run_id }}
        path: artifacts

  gnu-tls:
    runs-on: windows-2022
    name: GnuTLS / build only
    steps:
    - uses: actions/checkout@master
    - name: Install Windows Debugging Tools
      run: |
        choco install windows-sdk-10-version-2004-windbg --yes --no-progress
      shell: powershell
    - name: install cirunner
      run: |
        git clone --depth 1 https://github.com/pjsip/cirunner.git
        cirunner/installwindows.ps1
    - name: get gnutls
      run: Invoke-WebRequest -Uri "https://github.com/pjsip/third_party_libs/raw/main/gnutls-3.5.17-win.zip" -Outfile ".\gnutls.zip"
      shell: powershell
    - name: expand gnutls
      run: |
        Expand-Archive -LiteralPath .\gnutls.zip -DestinationPath .; pwd
        cd gnutls_build
        Add-Content ..\gnutls_dir.txt $pwd.Path
      shell: powershell
    - name: check gnutls folder
      run: |
        set /P GNUTLS_DIR=<gnutls_dir.txt
        dir "%GNUTLS_DIR%\include"
        dir "%GNUTLS_DIR%\lib\"
      shell: cmd
    - name: config site
      run: |
        echo '#define PJ_TODO(x)' > pjlib/include/pj/config_site.h
        Add-Content pjlib/include/pj/config_site.h "#define PJ_HAS_SSL_SOCK 1"
        Add-Content pjlib/include/pj/config_site.h "#define PJ_SSL_SOCK_IMP PJ_SSL_SOCK_IMP_GNUTLS"
      shell: powershell
    - name: check VsDevCmd.bat
      run: |
        for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do dir "%%i\Common7\Tools\VsDevCmd.bat"
      shell: cmd
    - name: MSBuild
      working-directory: .
      run: |
        set /P GNUTLS_DIR=<gnutls_dir.txt
        for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do call "%%i\Common7\Tools\VsDevCmd.bat"
        set INCLUDE=%INCLUDE%;%GNUTLS_DIR%\include
        set LIB=%LIB%;%GNUTLS_DIR%\lib
        msbuild pjproject-vs14.sln /p:PlatformToolset=v143 /p:Configuration=Release /p:Platform=win32 /p:UseEnv=true
