apply plugin: 'com.android.application'

android {
    compileSdk 33
    namespace 'org.pjsip.pjsua'

    defaultConfig {
        applicationId "org.pjsip.pjsua"
        minSdkVersion 23
        targetSdkVersion 33
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
        }
    }
}
